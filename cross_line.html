<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>クロスライン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D view, tactical HUD pinned to safe-area edges, touch cluster bottom-right */
:root{
  --ink:#0f1820; --panel:rgba(15,24,32,.80); --line:rgba(236,232,225,.20);
  --bone:#ece8e1; --mute:#93a1a9; --red:#ff4655; --teal:#38d9c0; --gold:#f2c14e;
  --f-disp:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--bone);font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#touch{position:absolute;inset:0}
.hud{position:absolute;pointer-events:none}
#top{top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:2px}
.sc{background:var(--panel);padding:4px 14px;display:flex;flex-direction:column;align-items:center;min-width:64px}
.sc b{font:700 28px/1 var(--f-disp)}
.sc.a b{color:var(--teal)} .sc.d b{color:var(--red)}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:12px;height:4px;background:currentColor;opacity:.9}
.pips i.dead{opacity:.18}
.sc.a .pips{color:var(--teal)} .sc.d .pips{color:var(--red)}
#clock{background:var(--panel);padding:4px 16px;text-align:center;min-width:92px}
#timer{font:700 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}
#phase{font-size:11px;letter-spacing:.12em;color:var(--mute);margin-top:3px}
#credits{top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);font:700 15px var(--f-disp);color:var(--gold);background:var(--panel);padding:3px 12px}
#mini{top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);width:180px;height:120px;background:rgba(15,24,32,.7);border:1px solid var(--line)}
#feed{top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;flex-direction:column;gap:4px;align-items:flex-end;max-width:46vw}
.kf{background:var(--panel);padding:4px 10px;font-size:13px;display:flex;gap:8px;align-items:center;animation:kfi .2s ease-out}
.kf .ta{color:var(--teal);font-weight:700} .kf .td{color:var(--red);font-weight:700}
.kf .w{font:500 11px var(--f-disp);color:var(--mute)} .kf .hs{color:var(--gold);font-weight:900}
.kf.me{border-left:3px solid var(--gold)} .kf.sys{color:var(--gold)}
@keyframes kfi{from{transform:translateX(20px);opacity:0}}
#cross{left:50%;top:50%;width:0;height:0;--g:4px}
#cross i{position:absolute;background:var(--teal);box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#cross .t,#cross .b{width:2px;height:7px;left:-1px}
#cross .l,#cross .r{height:2px;width:7px;top:-1px}
#cross .t{bottom:var(--g)} #cross .b{top:var(--g)} #cross .l{right:var(--g)} #cross .r{left:var(--g)}
#cross .dot{width:2px;height:2px;left:-1px;top:-1px}
#hitx{position:absolute;left:-9px;top:-9px;width:18px;height:18px;opacity:0;transition:opacity .12s}
#hitx::before,#hitx::after{content:"";position:absolute;left:8px;top:0;width:2px;height:18px;background:#fff}
#hitx::before{transform:rotate(45deg)} #hitx::after{transform:rotate(-45deg)}
#hitx.on{opacity:1;transition:none} #hitx.head::before,#hitx.head::after{background:var(--gold)}
#bar{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:2px;align-items:stretch}
.bx{background:var(--panel);padding:6px 14px;display:flex;align-items:center;gap:10px}
#hp{font:700 34px/1 var(--f-disp);font-variant-numeric:tabular-nums}
#ar{font:700 16px/1 var(--f-disp);color:var(--teal);display:flex;align-items:center;gap:4px}
#ar::before{content:"";width:10px;height:12px;background:currentColor;clip-path:polygon(50% 0,100% 20%,100% 60%,50% 100%,0 60%,0 20%)}
.lbl{font-size:10px;letter-spacing:.14em;color:var(--mute)}
#agentTag{font:700 11px var(--f-disp);letter-spacing:.1em}
.ab{display:flex;flex-direction:column;align-items:center;min-width:48px}
.ab b{font:700 13px var(--f-disp);border:1px solid var(--line);padding:1px 6px}
.ab span{font-size:10px;color:var(--mute);margin-top:2px;white-space:nowrap}
.ab em{font-style:normal;display:flex;gap:2px;margin-top:3px;height:4px}
.ab em i{width:9px;height:4px;background:var(--bone)}
.ab em i.o{opacity:.2}
#abX em i{width:5px;background:var(--gold)}
.ab.off{opacity:.35}
.ab.ready b{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.ab.act b{background:var(--red);color:#fff;border-color:var(--red)}
#ammo{font:700 34px/1 var(--f-disp);font-variant-numeric:tabular-nums}
#ammo small{font-size:15px;color:var(--mute);margin-left:3px}
#wname{font:500 12px var(--f-disp);letter-spacing:.08em;color:var(--mute)}
#banner{top:24%;left:0;right:0;text-align:center;opacity:0;transition:opacity .25s}
#banner.on{opacity:1}
#banner h2{margin:0;font:700 clamp(36px,7vw,72px)/1 var(--f-disp);letter-spacing:.06em;text-shadow:0 2px 18px rgba(0,0,0,.5)}
#banner p{margin:6px 0 0;font-size:15px;letter-spacing:.2em;color:var(--bone);text-shadow:0 1px 6px rgba(0,0,0,.7)}
#note{top:calc(50% + 46px);left:0;right:0;text-align:center;font-size:14px;color:var(--bone);text-shadow:0 1px 4px #000}
#scope{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 0,transparent 36vmin,#05080b 36.3vmin)}
#scope::before,#scope::after{content:"";position:absolute;background:rgba(0,0,0,.85)}
#scope::before{left:0;right:0;top:50%;height:1px} #scope::after{top:0;bottom:0;left:50%;width:1px}
#dmg{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(255,40,60,.75);opacity:0}
#flashov{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
#darkov{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,rgba(20,8,40,.75),#05020c 60%);opacity:0}
#tc{position:absolute;inset:0;pointer-events:none;display:none}
body.touch #tc{display:block}
.btn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(15,24,32,.42);border:1.5px solid rgba(236,232,225,.38);color:var(--bone);display:grid;place-items:center;font:700 13px var(--f-disp);letter-spacing:.04em;text-align:center;line-height:1.1}
.btn.down{background:rgba(236,232,225,.28)}
.btn small{display:block;font:500 9px var(--f-body);color:var(--mute)}
#bFire{right:calc(env(safe-area-inset-right,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:96px;height:96px;border-color:var(--red);font-size:15px}
#bFireL{left:calc(env(safe-area-inset-left,0px) + 30px);bottom:calc(env(safe-area-inset-bottom,0px) + 210px);width:62px;height:62px;border-color:var(--red)}
#bScope{right:calc(env(safe-area-inset-right,0px) + 138px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:60px;height:60px}
#bJump{right:calc(env(safe-area-inset-right,0px) + 36px);bottom:calc(env(safe-area-inset-bottom,0px) + 148px);width:60px;height:60px}
#bReload{right:calc(env(safe-area-inset-right,0px) + 132px);bottom:calc(env(safe-area-inset-bottom,0px) + 112px);width:54px;height:54px}
#bSwap{right:calc(env(safe-area-inset-right,0px) + 108px);bottom:calc(env(safe-area-inset-bottom,0px) + 190px);width:52px;height:52px}
#bC{right:calc(env(safe-area-inset-right,0px) + 214px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:56px;height:56px}
#bQ{right:calc(env(safe-area-inset-right,0px) + 206px);bottom:calc(env(safe-area-inset-bottom,0px) + 98px);width:56px;height:56px}
#bE{right:calc(env(safe-area-inset-right,0px) + 184px);bottom:calc(env(safe-area-inset-bottom,0px) + 166px);width:56px;height:56px}
#bX{right:calc(env(safe-area-inset-right,0px) + 30px);bottom:calc(env(safe-area-inset-bottom,0px) + 222px);width:62px;height:62px;border-color:var(--gold)}
#bX.ready{background:rgba(242,193,78,.4)}
#bBuy{right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 150px);width:auto;height:auto;border-radius:4px;padding:8px 14px;border-color:var(--gold);color:var(--gold)}
#joy{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:1.5px solid rgba(236,232,225,.3);background:rgba(15,24,32,.25);pointer-events:none;opacity:.5;left:calc(env(safe-area-inset-left,0px) + 110px);top:calc(100% - 120px - env(safe-area-inset-bottom,0px))}
#joy i{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:rgba(236,232,225,.45)}
#joy.on{opacity:1}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,16,22,.72);padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow:auto}
#start{background:linear-gradient(115deg,rgba(15,24,32,.92) 0 55%,rgba(255,70,85,.55) 55.1% 100%)}
.card{max-width:560px;width:100%}
.title{font:700 clamp(46px,9vw,88px)/.92 var(--f-disp);letter-spacing:.02em;margin:0}
.title span{color:var(--red)}
.tag{margin:10px 0 22px;font-size:14px;letter-spacing:.22em;color:var(--mute)}
.seg{display:flex;gap:6px;margin:6px 0 18px;flex-wrap:wrap}
.seg button{font:700 14px var(--f-body);background:transparent;color:var(--bone);border:1px solid var(--line);padding:8px 16px;cursor:pointer}
.seg button.on{background:var(--bone);color:var(--ink)}
.go{font:700 18px var(--f-disp);letter-spacing:.14em;background:var(--red);color:#fff;border:0;padding:14px 38px;cursor:pointer;clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,0 100%)}
.go:disabled{opacity:.4;cursor:default}
.go:focus-visible,.seg button:focus-visible,.item:focus-visible,.agc:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:18px 0 24px;color:var(--bone)}
.keys b{font:700 12px var(--f-disp);color:var(--gold);white-space:nowrap}
#pick{align-items:flex-start}
#pick .card{max-width:1040px}
.pickhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.pickhead h2{margin:0;font:700 clamp(28px,4.5vw,44px)/1 var(--f-disp);letter-spacing:.06em}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin:6px 0 4px}
.mp{font-family:var(--f-body);text-align:left;color:var(--bone);background:rgba(15,24,32,.88);border:1px solid var(--line);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.mp b{font:900 16px var(--f-body)} .mp span{font-size:11px;color:var(--mute);line-height:1.4}
.mp i{display:block;height:5px;margin-bottom:5px;background:var(--mc)}
.mp.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.mp:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.agents{display:grid;margin-top:6px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.agc{font-family:var(--f-body);text-align:left;color:var(--bone);background:rgba(15,24,32,.88);border:1px solid var(--line);padding:0;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.agc.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.agc .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:12px 12px 8px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 32%,transparent),transparent 70%)}
.agc .nm{font:900 22px/1 var(--f-body)}
.agc .rl{font:700 11px var(--f-disp);letter-spacing:.14em;color:var(--ac)}
.agc ul{list-style:none;margin:0;padding:4px 12px 12px;display:grid;gap:5px}
.agc li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:12px;line-height:1.35;color:var(--mute)}
.agc li b{font:700 12px var(--f-disp);color:var(--bone);text-align:center;border:1px solid var(--line);height:18px;line-height:16px}
.agc li.x b{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.agc li strong{color:var(--bone);font-weight:700;margin-right:4px}
#buy .card{max-width:820px;background:var(--panel);border:1px solid var(--line);padding:18px}
.buyhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.buyhead h3{margin:0;font:700 22px var(--f-disp);letter-spacing:.1em}
#buyCred{font:700 22px var(--f-disp);color:var(--gold)}
#buyTime{font-size:12px;color:var(--mute);letter-spacing:.1em}
.grp{font-size:11px;letter-spacing:.2em;color:var(--mute);margin:14px 0 6px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:6px}
.item{font-family:var(--f-body);text-align:left;background:rgba(236,232,225,.05);border:1px solid var(--line);color:var(--bone);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.item:hover{background:rgba(236,232,225,.12)}
.item .nm{font:700 15px var(--f-disp)}
.item .pr{font:700 13px var(--f-disp);color:var(--gold)}
.item .st{font-size:11px;color:var(--mute);line-height:1.4}
.item.own{border-color:var(--teal)} .item.own .pr{color:var(--teal)}
.item[disabled]{opacity:.35;cursor:default}
.closeb{margin-top:14px;font:700 14px var(--f-disp);letter-spacing:.12em;background:var(--bone);color:var(--ink);border:0;padding:10px 26px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:18px 0 22px}
.stats div{background:rgba(236,232,225,.06);padding:12px}
.stats b{display:block;font:700 28px var(--f-disp)}
.stats span{font-size:11px;color:var(--mute);letter-spacing:.12em}
.ghost{font:700 15px var(--f-disp);letter-spacing:.12em;background:transparent;color:var(--bone);border:1px solid var(--line);padding:12px 22px;cursor:pointer;margin-left:8px;vertical-align:top}
.ghost:hover{border-color:var(--gold);color:var(--gold)}
#arsenal .card{max-width:980px;background:var(--panel);border:1px solid var(--line);padding:16px}
.ars{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;margin-top:12px}
.alist{display:flex;flex-direction:column;gap:4px}
.alist button{font:700 14px var(--f-body);text-align:left;background:rgba(236,232,225,.05);color:var(--bone);border:1px solid var(--line);padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.alist button small{font:500 11px var(--f-body);color:var(--mute)}
.alist button.on{border-color:var(--gold);background:rgba(242,193,78,.12)}
#pv{width:100%;height:220px;display:block;background:radial-gradient(ellipse at center,#2a3540,#0f1820 70%);touch-action:none;cursor:grab}
.agrp{margin-top:12px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:6px}
.sw button{font:700 12px var(--f-body);background:rgba(236,232,225,.05);color:var(--bone);border:1px solid var(--line);padding:6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px}
.sw button i{display:block;height:16px;background:var(--c)}
.sw button.on,.opt button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt button{font:700 13px var(--f-body);background:rgba(236,232,225,.05);color:var(--bone);border:1px solid var(--line);padding:7px 12px;cursor:pointer}
.odesc{font-size:12px;color:var(--mute);margin-top:5px;min-height:1.3em}
.alist button:focus-visible,.sw button:focus-visible,.opt button:focus-visible,.ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:640px){ .ars{grid-template-columns:1fr} .alist{flex-direction:row;flex-wrap:wrap} }
@media (max-height:500px){ #mini{width:135px;height:90px} #hp,#ammo{font-size:26px} .bx{padding:4px 10px} }
@media (prefers-reduced-motion:reduce){ .kf{animation:none} #banner{transition:none} }
</style>

<div id="app">
  <canvas id="c"></canvas>
  <div id="touch"></div>
  <div id="scope" hidden></div>
  <div id="dmg"></div>
  <div id="darkov"></div>
  <div id="flashov"></div>

  <div class="hud" id="top">
    <div class="sc a"><b id="sA">0</b><div class="pips" id="pA"></div></div>
    <div id="clock"><div id="timer">0:15</div><div id="phase">購入フェーズ</div></div>
    <div class="sc d"><b id="sD">0</b><div class="pips" id="pD"></div></div>
  </div>
  <div class="hud" id="credits">¤ 800</div>
  <canvas class="hud" id="mini" width="270" height="180"></canvas>
  <div class="hud" id="feed"></div>
  <div class="hud" id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i><b id="hitx"></b></div>
  <div class="hud" id="note"></div>
  <div class="hud" id="banner"><h2 id="bnT"></h2><p id="bnS"></p></div>
  <div class="hud" id="bar">
    <div class="bx"><div><div id="agentTag">—</div><div id="hp">100</div></div><div id="ar">0</div></div>
    <div class="bx" id="abil"></div>
    <div class="bx"><div><div id="ammo">12<small>/36</small></div><div id="wname">P-9</div></div></div>

    <div class="btn" id="bSwap" data-a="swap">武器<small>切替</small></div>
    <div class="btn" id="bC" data-a="C">C</div>
    <div class="btn" id="bQ" data-a="Q">Q</div>
    <div class="btn" id="bE" data-a="E">E</div>
    <div class="btn" id="bX" data-a="X">X</div>

  <div class="ov" id="buy" hidden>
    <div class="card">
      <div class="buyhead"><h3>購入</h3><div><span id="buyTime"></span> <span id="buyCred">¤ 800</span></div></div>
      <div class="grp">武器</div><div class="items" id="buyW"></div>
      <div class="grp">シールドとスキル</div><div class="items" id="buyG"></div>
      <button class="closeb" id="buyClose" type="button">閉じる</button><button class="ghost" id="arsBtn3" type="button">ナイフと銃のカスタム</button>
    </div>
  </div>

  <div class="ov" id="pick" hidden>
    <div class="card">
      <div class="pickhead">
        <div><div class="lbl">エージェント選択</div><h2 id="pickName">キャラクターを選ぶ</h2></div>
        <div><button class="ghost" id="arsBtn2" type="button" style="margin:0 8px 0 0">アーセナル</button><button class="go" id="pickGo" type="button" disabled>出撃</button></div>
      </div>
      <div class="lbl">ステージ</div>
      <div class="maps" id="mapSel"></div>
      <div class="lbl" style="margin-top:14px">エージェント</div>
      <div class="agents" id="agentList"></div>
    </div>
  </div>

  else if(b.memory>0){ b.memory-=dt; const dd=h2(b.pos.x,b.pos.z,b.lastSeen.x,b.lastSeen.z); b.stealth=dd<13; spd=(b.stealth?2.6:4.4)*sm;
    if(botMoveTo(b,b.lastSeen.x,b.lastSeen.z,dt,spd,1)) b.memory=0; want=dd>2?Math.atan2(b.lastSeen.x-b.pos.x,b.lastSeen.z-b.pos.z):b.moveYaw; b.pitch=0; }
  else if(b.alertT>0){ b.alertT-=dt; want=b.alertYaw; }
  else {
    b.pitch=0; spd=4.3*sm;
    if(phase==='live'&&b.mag<W.mag*.45&&b.reload<=0&&b.weapon!=='knives'){ b.reload=W.reload; sReloadBot(b); }
    b.scanT-=dt; if(b.scanT<=0){ b.scanT=rand(.6,1.1); b.lookYaw=scanYaw(b); }
    const look=()=>(b.lookYaw!=null&&Math.abs(angDiff(b.moveYaw,b.lookYaw))<1.7)?b.lookYaw:b.moveYaw;
    if(b.ri<b.route.length){ const r=b.route[b.ri]; if(botMoveTo(b,r.x,r.z,dt,spd,1.3)) b.ri++; want=look(); }
    else if(b.hold){ if(botMoveTo(b,b.hold.x,b.hold.z,dt,spd,.6)) want=b.hold.yaw+Math.sin(time*.55+b.id*2)*.45; else want=b.moveYaw; }
    else { spd=3.6*sm; if(!b.wander||botMoveTo(b,b.wander.x,b.wander.z,dt,spd,1)) b.wander=randomFree(b.team===0?6:-40,b.team===0?42:-6,-28,28); want=look(); }
  }
  const ad=angDiff(b.yaw,want); b.yaw+=clamp(ad,-rate*dt,rate*dt);
  b.walkAmp+=((b.moving?1:0)-b.walkAmp)*Math.min(1,dt*8); if(b.moving) b.walkPh+=dt*Math.max(2.5,spd)*2.4;
  const sw=Math.sin(b.walkPh)*.55*b.walkAmp*(b.stealth?.6:1);
  U.legs[0].hip.rotation.x=sw; U.legs[1].hip.rotation.x=-sw;
  U.legs[0].knee.rotation.x=Math.max(0,Math.sin(b.walkPh))*.9*b.walkAmp; U.legs[1].knee.rotation.x=Math.max(0,-Math.sin(b.walkPh))*.9*b.walkAmp;
  let crT=0; const engaged=b.target&&!b.mode;
  if(!b.moving&&phase==='live'){ if(engaged&&b.crouchFire&&W.auto&&h2(b.pos.x,b.pos.z,b.target.pos.x,b.target.pos.z)>10) crT=1; else if(!b.target&&b.crouchHold&&b.hold&&b.ri>=b.route.length&&b.memory<=0) crT=1; else if(b.mode==='cover'&&b.reload>0) crT=1; }
  b.cr+=(crT-b.cr)*Math.min(1,dt*8); if(!b.moving) b.curSpd*=Math.max(0,1-dt*8);
  b.kick*=Math.max(0,1-dt*14); b.flinch*=Math.max(0,1-dt*8);
  const cr=b.cr, pit=clamp(b.pitch||0,-.6,.6);
  if(cr>.01) for(let i=0;i<2;i++){ U.legs[i].hip.rotation.x=U.legs[i].hip.rotation.x*(1-cr)-1.2*cr*(i?.8:1); U.legs[i].knee.rotation.x=U.legs[i].knee.rotation.x*(1-cr)+2*cr; }
  U.torso.rotation.x=.06*b.walkAmp+(b.stealth?.12:0)+cr*.15-b.flinch*.18+Math.sin(time*1.7+b.id)*.012;
  U.hg.rotation.x=-pit*.8-b.flinch*.25; U.hg.rotation.y=b.flinch*.25*Math.sin(b.id*7);
  let rl=0; if(b.reload>0){ const R=WEAPONS[b.weapon].reload||2; rl=Math.sin(Math.min(1,1-b.reload/R)*Math.PI); }
  U.armR.rotation.x=U.armR.userData.bx-pit-b.kick*.12; U.armL.rotation.x=U.armL.userData.bx-pit+rl*.7;
  U.gunHolder.rotation.set(-pit-b.kick*.12,Math.PI,rl*.6); U.gunHolder.position.z=.36-b.kick*.05;
  if(U.np) U.np.visible=true;
  if(b.moving&&spd>3.2&&!b.stealth){ b.stepAcc+=dt; if(b.stepAcc>.33){ b.stepAcc=0; if(camDist(b.pos)<40) sStep({x:b.pos.x,y:.1,z:b.pos.z},1.2); } }
  m.position.set(b.pos.x,(b.moving?Math.abs(Math.sin(b.walkPh))*.025:0)-.4*b.cr,b.pos.z); m.rotation.set(0,b.yaw,0);
}
function separate(){
  const live=agents.filter(a=>a.alive);
  for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){ const a=live[i],b=live[j]; const dx=b.pos.x-a.pos.x,dz=b.pos.z-a.pos.z,d=Math.hypot(dx,dz);
    if(d<.75&&d>1e-4){ const p=(.75-d)/2; a.pos.x-=dx/d*p; a.pos.z-=dz/d*p; b.pos.x+=dx/d*p; b.pos.z+=dz/d*p; } }
}

function updAbilities(dt){
  for(const a of agents){
    a.slowT=Math.max(0,a.slowT-dt); a.disarmT=Math.max(0,a.disarmT-dt); a.revealT=Math.max(0,a.revealT-dt);
    if(!a.alive) continue;
    if(a.healT>0){ a.healT-=dt; heal(a,15*dt); }
    if(a.rebirth){ a.rebirth.t-=dt; if(a.rebirth.mesh) a.rebirth.mesh.material.opacity=.4+.35*Math.abs(Math.sin(time*5)); if(a.rebirth.t<=0) rebirthReturn(a,false); }
    if(a.ultActive){ a.ultActive.t-=dt; if(a.ultActive.t<=0) endUlt(a); }
    if(a.agent.id==='frost'&&a.ch.Q<1&&phase==='live'){ a.qRegen+=dt; if(a.qRegen>=35){ a.ch.Q=1; a.qRegen=0; } }
  }
  for(let i=zones.length-1;i>=0;i--){ const z=zones[i];
    if(z.delay>0){ z.delay-=dt;
      if(z.kind==='lock'&&z.mesh){ const u=1-z.delay/4; z.mesh.scale.setScalar(1+u*19); z.mesh.position.x=z.x; }
      if(z.kind==='orbital'&&z.mesh) z.mesh.material.opacity=.5+.5*Math.abs(Math.sin(time*12));
      if(z.delay<=0){
        if(z.kind==='orbital'){ scene.remove(z.mesh); z.mesh=new THREE.Mesh(new THREE.CylinderGeometry(z.r,z.r,40,32,1,true),new THREE.MeshBasicMaterial({color:0xffb04a,transparent:true,opacity:.5,depthWrite:false,side:THREE.DoubleSide}));
          z.mesh.position.set(z.x,20,z.z); scene.add(z.mesh); sNoise(.7*shotVol(z),500,1.2); sTone(80,1,.3*shotVol(z),'sawtooth',40); }
        if(z.kind==='lock'){ let n=0; for(const a of agents){ if(!a.alive||a.team===z.team) continue; if(h2(a.pos.x,a.pos.z,z.x,z.z)<z.r){ a.disarmT=8; a.slowT=8; n++; if(a.isPlayer){ P.firing=false; banner('ロックダウン','8秒間 撃てない','var(--gold)',1.6);} } }
          sNoise(.6*shotVol(z),300,.8); feedSys(`ロックダウン：${n}人を封鎖`,z.team); }
      }
      continue; }
    z.t+=dt;
    if(z.kind==='fire'&&z.mesh) z.mesh.material.opacity=(.4+.2*Math.sin(time*14+z.x))*Math.min(1,(z.life-z.t)*2);
    if(z.kind==='orbital'&&z.mesh) z.mesh.material.opacity=.55*Math.min(1,(z.life-z.t)*2);
    if(z.kind==='slow'&&z.mesh) z.mesh.material.opacity=.38*Math.min(1,(z.life-z.t)*2);
    for(const a of agents){ if(!a.alive) continue; const d=h2(a.pos.x,a.pos.z,z.x,z.z); if(d>z.r||a.pos.y>3) continue;
      if(a.team!==z.team){
        if(z.dps) damage(a,z.dps*dt,z.owner,'body',z.label,true);
        if(z.slow) a.slowT=Math.max(a.slowT,.3);
        if(!a.isPlayer&&z.dps&&(!a.flee||a.flee.t<=0)){ const dx=a.pos.x-z.x,dz=a.pos.z-z.z,L=Math.hypot(dx,dz)||1; a.flee={x:z.x+dx/L*(z.r+2.5),z:z.z+dz/L*(z.r+2.5),t:1.2}; }
      } else if(a===z.owner&&z.heal) heal(a,z.heal*dt);
    }
    if(z.t>=z.life){ if(z.mesh) scene.remove(z.mesh); zones.splice(i,1); }
  }
  for(let i=devices.length-1;i>=0;i--){ const d=devices[i]; d.armT-=dt; if(d.armT>0) continue;
    for(const a of agents){ if(!a.alive||a.team===d.team) continue; if(h2(a.pos.x,a.pos.z,d.x,d.z)<d.r){
      if(d.kind==='trap'){ reveal(a,5); a.slowT=Math.max(a.slowT,3); damage(a,20,d.owner,'leg','トラップ'); sTone(1600,.2,.2*shotVol(d),'square',800); if(d.owner.isPlayer) note(`トラップ発動：${a.name}`); }
      else { addZone({kind:'nano',x:d.x,z:d.z,r:3.4,life:4,dps:50,team:d.team,owner:d.owner,label:'ナノスウォーム'}); sNoise(.4*shotVol(d),3000,.5,'bandpass'); }
      scene.remove(d.mesh); devices.splice(i,1); break; } } }
  for(let i=turrets.length-1;i>=0;i--){ const t=turrets[i]; t.life-=dt; t.cd-=dt;
    if(t.life<=0||t.hp<=0||!t.owner.alive&&t.life>3){ if(t.hp<=0) burst({x:t.x,y:.6,z:t.z},1.4,0xe8c55c); scene.remove(t.mesh); turrets.splice(i,1); continue; }
    const o={x:t.x,y:.85,z:t.z}; let best=null,bd=30;
    for(const a of agents){ if(!a.alive||a.team===t.team) continue; const dd=h2(a.pos.x,a.pos.z,t.x,t.z); if(dd<bd&&LOS(o,{x:a.pos.x,y:a.pos.y+1.1,z:a.pos.z})){bd=dd;best=a;} }
    if(best){ const want=Math.atan2(best.pos.x-t.x,best.pos.z-t.z); t.yaw+=clamp(angDiff(t.yaw,want),-6*dt,6*dt);
      if(t.cd<=0&&Math.abs(angDiff(t.yaw,want))<.1&&phase==='live'){ t.cd=.16;
        let dx=best.pos.x-o.x,dy=best.pos.y+1.1-o.y,dz=best.pos.z-o.z; const L=Math.hypot(dx,dy,dz); dx/=L;dy/=L;dz/=L;
        const e=.05; const d={x:dx+gauss()*e,y:dy+gauss()*e*.5,z:dz+gauss()*e}; const l=Math.hypot(d.x,d.y,d.z); d.x/=l;d.y/=l;d.z/=l;
        const end=fireRay(t.proxy,o,d,'turret'); tracer(o,end,0xffe08a); sShot('turret',.6,{x:t.x,y:.8,z:t.z}); } }
    else t.yaw+=dt*.6;
    t.head.rotation.y=t.yaw; }
  for(let i=boxes.length-1;i>=0;i--){ const b=boxes[i]; if(b.life===undefined) continue; b.life-=dt;
    if(b.life<1) b.mesh.material.opacity=Math.max(0,b.life)*.9;
    if(b.life<=0){ scene.remove(b.mesh); boxes.splice(i,1); rebuildGrid(); } }
}

  else { if(keys.KeyW)f+=1; if(keys.KeyS)f-=1; if(keys.KeyD)s+=1; if(keys.KeyA)s-=1; const m=Math.hypot(f,s); if(m>1){f/=m;s/=m;} P.walking=!!(keys.ShiftLeft||keys.ShiftRight); }
  const fx=Math.sin(P.yaw),fz=Math.cos(P.yaw), rx=-Math.cos(P.yaw),rz=Math.sin(P.yaw);
  return {wx:fx*f+rx*s, wz:fz*f+rz*s};
}

function refreshBuy(){

  for(const g of GEAR){ const b=$('#bi-'+g.k); let own=false, pr='';
    if(g.k==='light'){ own=me.armor>=25; pr=own?'所持中':'¤ '+g.cost; }
    else if(g.k==='heavy'){ own=me.armor>=50; pr=own?'所持中':'¤ '+g.cost; }
    else { const max=me.agent[g.k].max; own=me.ch[g.k]>=max; pr=g.sig&&g.cost===0?`毎ラウンド無料 ・ ${me.ch[g.k]}/${max}`:`¤ ${g.cost} ・ ${me.ch[g.k]}/${max}`; if(g.cost===0) own=true; }

function buy(k){
  if(phase!=='buy') return;
  const w=WEAPONS[k];
  if(w){ if(w.cost<0||P.credits<w.cost||P.slots[w.slot]===k) return; P.credits-=w.cost; P.slots[w.slot]=k; P.mags[w.slot]=magOf(k); P.res[w.slot]=magOf(k)*3; P.slot=w.slot; P.reload=0; P.scoped=false; setVM(k); }
  else { const g=GEAR.find(x=>x.k===k); if(!g||P.credits<g.cost) return;
    if(k==='light'){ if(me.armor>=25) return; me.armor=25; }
    else if(k==='heavy'){ if(me.armor>=50) return; me.armor=50; }
    else { if(g.cost===0||me.ch[k]>=me.agent[k].max) return; me.ch[k]++; }
    P.credits-=g.cost; }
  sTone(880,.06,.1,'square'); refreshBuy();
}

      if((_f.x*dx+_f.y*dy+_f.z*dz)/dd>Math.cos(50*DEG)&&LOS({x:c.x,y:c.y,z:c.z},{x:f.pos.x,y:f.pos.y+1.3,z:f.pos.z})) f.spotT=1.5; } }

    const cv=$('#pv'); cv.addEventListener('pointerdown',e=>{ pvDrag={x:e.clientX,r:pvRot}; try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
    cv.addEventListener('pointermove',e=>{ if(pvDrag) pvRot=pvDrag.r+(e.clientX-pvDrag.x)*.012; }); const up=()=>{ pvDrag=null; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); }
  if(pvModel) pvScene.remove(pvModel);
  const inner=arsSel==='melee'?buildKnife(LO.knife.type,LO.knife.skin):buildGun(arsSel,true,optFor(arsSel));
  inner.updateMatrixWorld(true); const box=new THREE.Box3().setFromObject(inner), c=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3()); inner.position.sub(c);
  pvModel=new THREE.Group(); pvModel.add(inner); pvScene.add(pvModel);
  const L=Math.max(sz.x,sz.y,sz.z)||.5; pvCam.position.set(0,L*.22,L*2.2); pvCam.lookAt(0,0,0);
  const cv=$('#pv'), w=cv.clientWidth||400, hh=cv.clientHeight||220; pvR.setSize(w,hh,false); pvCam.aspect=w/hh; pvCam.updateProjectionMatrix();
}
