function makeTile(base,blobs,grassN,grassCol,speck){
  const t=document.createElement('canvas');t.width=t.height=256;const g=t.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,256,256);
  const blob=(x,y,r,c)=>{g.fillStyle=c;for(const ox of[-256,0,256])for(const oy of[-256,0,256]){g.beginPath();g.arc(x+ox,y+oy,r,0,TAU);g.fill();}};
  for(let i=0;i<50;i++)blob(rand(0,256),rand(0,256),rand(8,28),blobs[Math.floor(Math.random()*blobs.length)]);
  if(grassN){g.strokeStyle=grassCol;g.lineWidth=1;
    for(let i=0;i<grassN;i++){const x=rand(2,254),y=rand(8,254);g.beginPath();g.moveTo(x,y);g.lineTo(x+rand(-2,2),y-rand(3,6));g.stroke();}}
  if(speck){g.fillStyle=speck;for(let i=0;i<420;i++)g.fillRect(rand(0,256),rand(0,256),2,2);}
  return ctx.createPattern(t,'repeat');
}

let actx=null,noiseBuf=null;
function unlockAudio(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();
    const len=Math.floor(actx.sampleRate*1.6);noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}catch(e){actx=null;}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function sfx(type,vol=1){if(!actx||!noiseBuf)return;try{const t=actx.currentTime;
  if(type==='pickup'){const o=actx.createOscillator(),g=actx.createGain();o.type='square';
    o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.07);
    g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.2);return;}
  const src=actx.createBufferSource();src.buffer=noiseBuf;const f=actx.createBiquadFilter(),g=actx.createGain();
  src.connect(f);f.connect(g);g.connect(actx.destination);let dur=.1;
  if(type==='shot'){f.type='lowpass';f.frequency.value=3000;g.gain.setValueAtTime(.16*vol,t);dur=.08;}
  else if(type==='eshot'){f.type='lowpass';f.frequency.value=1600;g.gain.setValueAtTime(.1*vol,t);dur=.07;}
  else if(type==='boom'){f.type='lowpass';f.frequency.setValueAtTime(1000,t);f.frequency.exponentialRampToValueAtTime(60,t+.9);g.gain.setValueAtTime(.55*vol,t);dur=1;}
  else if(type==='cannon'){f.type='lowpass';f.frequency.setValueAtTime(700,t);f.frequency.exponentialRampToValueAtTime(80,t+.4);g.gain.setValueAtTime(.35*vol,t);dur=.45;}
  else if(type==='throw'){f.type='bandpass';f.frequency.value=900;g.gain.setValueAtTime(.05,t);dur=.12;}
  g.gain.exponentialRampToValueAtTime(.001,t+dur);src.start(t,Math.random()*.5,dur+.02);
}catch(e){}}

// ---------- マップ ----------
let obstacles=[],patches=[],waters=[],bridges=[],roads=[],stage=null,stageIdx=-1;
function stageFor(n){return CFG.stages[Math.floor((n-1)/CFG.stageWaves)%CFG.stages.length];}
function stageNo(n){return Math.floor((n-1)/CFG.stageWaves)+1;}      // 何ステージ目か
function waveInStage(n){return (n-1)%CFG.stageWaves+1;}              // ステージ内の何ウェーブ目か
function inRect(r,x,y){return x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h;}
function rectsHit(x,y,w,h,list,pad){for(const r of list)if(x<r.x+r.w+pad&&x+w+pad>r.x&&y<r.y+r.h+pad&&y+h+pad>r.y)return true;return false;}
function onBridge(x,y){for(const b of bridges)if(inRect(b,x,y))return true;return false;}
function inWater(x,y){if(!waters.length)return false;
  for(const w of waters)if(inRect(w,x,y))return !onBridge(x,y);
  return false;}
function onRoad(x,y){for(const r of roads)if(inRect(r,x,y))return true;return false;}
// 地形による移動速度の倍率（veh=true で車両）
function terrainMul(x,y,veh){
  if(inWater(x,y))return veh?CFG.waterCarSlow:CFG.waterSlow;
  if(veh&&roads.length&&onRoad(x,y))return CFG.roadBoost;
  if(stage&&stage.snow)return veh?CFG.snowCarSlow:CFG.snowSlow;
  return 1;}
function genMap(def,cx,cy){
  stage=def||CFG.stages[0];obstacles=[];patches=[];waters=[];bridges=[];roads=[];
  groundPat=PATS[stage.ground]||PATS.grass;
  const kx=cx===undefined?WORLD/2:cx,ky=cy===undefined?WORLD/2:cy;
  if(stage.river){ // 川を1本通し、橋を3本架ける
    const vert=Math.random()<.5,wd=rand(150,210),pos=rand(WORLD*.3,WORLD*.62);
    waters.push(vert?{x:pos,y:-40,w:wd,h:WORLD+80}:{x:-40,y:pos,w:WORLD+80,h:wd});
    for(let i=0;i<3;i++){const t=clamp(WORLD*(.16+.33*i)+rand(-70,70),60,WORLD-200),bw=130;
      bridges.push(vert?{x:pos-16,y:t,w:wd+32,h:bw}:{x:t,y:pos-16,w:bw,h:wd+32});}}
  if(stage.roads){ // 碁盤の目の舗装路
    const rw=64;
    for(let i=0;i<3;i++){
      roads.push({x:clamp(WORLD*(.22+.28*i)+rand(-50,50),40,WORLD-rw-40),y:-20,w:rw,h:WORLD+40});
      roads.push({x:-20,y:clamp(WORLD*(.22+.28*i)+rand(-50,50),40,WORLD-rw-40),w:WORLD+40,h:rw});}}
  for(const b of[{x:kx-130,y:ky-110,w:90,h:22},{x:kx+50,y:ky+90,w:22,h:90}]){ // 初期位置そばの遮蔽
    const x=clamp(b.x,20,WORLD-20-b.w),y=clamp(b.y,20,WORLD-20-b.h);
    if(!rectsHit(x,y,b.w,b.h,waters,0)&&!rectsHit(x,y,b.w,b.h,roads,0))
      obstacles.push({x,y,w:b.w,h:b.h,type:'sandbag',hp:180,maxHp:180,seed:Math.random()});}
  function overlaps(x,y,w,h,pad){for(const p of obstacles){if(x<p.x+p.w+pad&&x+w+pad>p.x&&y<p.y+p.h+pad&&y+h+pad>p.y)return true;}return false;}
  function place(w,h,type,hp,pad,avoidRoad){for(let t=0;t<44;t++){const x=rand(80,WORLD-80-w),y=rand(80,WORLD-80-h);
    if(Math.abs(x+w/2-kx)<w/2+170&&Math.abs(y+h/2-ky)<h/2+170)continue;
    if(overlaps(x,y,w,h,pad))continue;
    if(rectsHit(x,y,w,h,waters,14))continue;                 // 川の中には置かない
    if(avoidRoad&&rectsHit(x,y,w,h,roads,8))continue;        // 道路をふさがない
    obstacles.push({x,y,w,h,type,hp,maxHp:hp,seed:Math.random()});return;}}
  function placeNear(cx2,cy2,rad,w,h,type,hp,pad){for(let t=0;t<30;t++){
    const a=rand(0,TAU),d=rand(0,rad),x=clamp(cx2+Math.cos(a)*d,80,WORLD-80-w),y=clamp(cy2+Math.sin(a)*d,80,WORLD-80-h);
    if(Math.abs(x+w/2-kx)<w/2+170&&Math.abs(y+h/2-ky)<h/2+170)continue;
    if(overlaps(x,y,w,h,pad))continue;
    if(rectsHit(x,y,w,h,waters,14)||rectsHit(x,y,w,h,roads,8))continue;
    obstacles.push({x,y,w,h,type,hp,maxHp:hp,seed:Math.random()});return;}}
  const S=stage;
  for(let i=0;i<S.buildings;i++)place(rand(130,250),rand(110,210),'building',Infinity,S.roads?70:110,true);
  for(let i=0;i<S.sandbags;i++){if(Math.random()<.5)place(rand(80,150),22,'sandbag',180,50,!!S.roads);else place(22,rand(80,150),'sandbag',180,50,!!S.roads);}
  for(let i=0;i<S.crates;i++)place(34,34,'crate',90,40,!!S.roads);
  if(S.key==='forest'){ // 木立をかたまりで置いて、林と開けた場所を作る
    const groves=13;
    for(let g=0;g<groves;g++){const gx2=rand(160,WORLD-160),gy2=rand(160,WORLD-160);
      for(let i=0;i<Math.ceil(S.trees/groves);i++){const sz=rand(30,42);
        placeNear(gx2,gy2,240,sz,sz,'tree',140,16);}}}
  else for(let i=0;i<S.trees;i++){const sz=rand(30,42);place(sz,sz,'tree',140,40,true);}
  for(let i=0;i<40;i++)patches.push({x:rand(0,WORLD),y:rand(0,WORLD),rx:rand(40,140),ry:rand(30,90),rot:rand(0,TAU)});
  forts=[];{ // 味方の固定砲台
    const fk=Object.keys(CFG.forts);
    for(let i=0;i<CFG.fortsPerStage;i++)for(let t=0;t<80;t++){
      const x=rand(150,WORLD-150),y=rand(150,WORLD-150);
      if(circleBlocked(x,y,40)||rectsHit(x-30,y-30,60,60,waters,12)||rectsHit(x-30,y-30,60,60,roads,6))continue;
      if(Math.abs(x-kx)<190&&Math.abs(y-ky)<190)continue;
      if(forts.some(f=>Math.hypot(f.x-x,f.y-y)<420))continue;
      const ft=fk[i%fk.length];
      forts.push({x,y,type:ft,ang:rand(0,TAU),cd:rand(0,1),burst:0,flash:0,tgt:null,checkT:0,
        hp:CFG.forts[ft].hp,maxHp:CFG.forts[ft].hp});break;}}
  aas=[];
  if(stageNo(wave)>=CFG.airFromStage){ // 空襲のあるステージには対空砲が据えてある
    const ks=Object.keys(CFG.aaGuns);
    for(let i=0;i<CFG.aaPerStage;i++)for(let t=0;t<80;t++){
      const x=rand(150,WORLD-150),y=rand(150,WORLD-150);
      if(circleBlocked(x,y,44)||rectsHit(x-34,y-34,68,68,waters,12))continue;
      if(aas.some(g=>Math.hypot(g.x-x,g.y-y)<380))continue;
      const ak=ks[i%ks.length];
      aas.push({x,y,type:ak,ang:rand(0,TAU),cd:0,flash:0,hp:CFG.aaGuns[ak].hp,maxHp:CFG.aaGuns[ak].hp});break;}}
}
function solidAt(x,y,buildingsOnly){for(const o of obstacles){if((!buildingsOnly||o.type==='building')&&x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)return o;}return null;}
function circleBlocked(x,y,r){for(const o of obstacles){const nx=clamp(x,o.x,o.x+o.w),ny=clamp(y,o.y,o.y+o.h);if((x-nx)**2+(y-ny)**2<r*r)return true;}return false;}
function lineClear(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/16);
  for(let i=1;i<n;i++){if(solidAt(x1+(x2-x1)*i/n,y1+(y2-y1)*i/n,true))return false;}return true;}
function pushOut(e){for(const o of obstacles){const nx=clamp(e.x,o.x,o.x+o.w),ny=clamp(e.y,o.y,o.y+o.h);
    const dx=e.x-nx,dy=e.y-ny,d2=dx*dx+dy*dy;if(d2>=e.r*e.r)continue;
    if(d2<1e-6){const l=e.x-o.x,r=o.x+o.w-e.x,t=e.y-o.y,b=o.y+o.h-e.y,m=Math.min(l,r,t,b);
      if(m===l)e.x=o.x-e.r;else if(m===r)e.x=o.x+o.w+e.r;else if(m===t)e.y=o.y-e.r;else e.y=o.y+o.h+e.r;}
    else{const d=Math.sqrt(d2);e.x+=dx/d*(e.r-d);e.y+=dy/d*(e.r-d);}}
  e.x=clamp(e.x,e.r,WORLD-e.r);e.y=clamp(e.y,e.r,WORLD-e.r);}
function moveEntity(e,dx,dy){e.x+=dx;e.y+=dy;pushOut(e);
  if((dx||dy)&&waters.length&&inWater(e.x,e.y)&&Math.random()<.05)
    addP({x:e.x+rand(-7,7),y:e.y+rand(-7,7),vx:rand(-25,25),vy:rand(-45,-10),life:.35,size:3,grow:3,color:'#cfe8f2',kind:'dot',drag:2});}

function newPlayer(){return{x:WORLD/2,y:WORLD/2,r:14,hp:CFG.playerHp,maxHp:CFG.playerHp,ang:-Math.PI/2,moveAng:-Math.PI/2,inCar:false,fireCd:0,grenCd:0,
  gren:CFG.startGrenades,base:'rifle',baseLvl:0,weapon:'rifle',wTime:0,hurt:0,walk:0,aa:null};}

// ---------- 入力 ----------
const sticks={move:null,aim:null},keys={},mouse={x:0,y:0,down:false,used:false};
let touchUsed=false;
function grenBtn(){return{x:W-66,y:Math.max(120,H-215),r:34};}
cv.addEventListener('touchstart',e=>{e.preventDefault();unlockAudio();touchUsed=true;
  if(state!=='play'){handleTap();return;}
  for(const t of e.changedTouches){const x=t.clientX,y=t.clientY,g=grenBtn();
    const ab=aaBtn();if(aaBtnVisible()&&Math.hypot(x-ab.x,y-ab.y)<ab.r+10){toggleAA();continue;}
    const cb=carBtn();if(carBtnVisible()&&Math.hypot(x-cb.x,y-cb.y)<cb.r+10){toggleCar();continue;}
    if(Math.hypot(x-g.x,y-g.y)<g.r+12){throwGrenade();continue;}

},{passive:false});

},{passive:false});
function tEnd(e){e.preventDefault();for(const t of e.changedTouches)for(const k of['move','aim']){const s=sticks[k];if(s&&s.id===t.identifier)sticks[k]=null;}}
cv.addEventListener('touchend',tEnd,{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

cv.addEventListener('mousedown',e=>{unlockAudio();if(state!=='play'){handleTap();return;}
  const cb=carBtn(),ab=aaBtn(),g=grenBtn();
  if(aaBtnVisible()&&Math.hypot(e.clientX-ab.x,e.clientY-ab.y)<ab.r){toggleAA();return;}
  if(carBtnVisible()&&Math.hypot(e.clientX-cb.x,e.clientY-cb.y)<cb.r){toggleCar();return;}

  if(e.code==='KeyG'||e.code==='Space'){throwGrenade();e.preventDefault();}

  if(e.code==='KeyR')toggleAA();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

function readInput(){let mx=0,my=0,aim=null,fire=false,touchAim=false;const R=55;
  const m=sticks.move;if(m){let dx=m.x-m.bx,dy=m.y-m.by;const d=Math.hypot(dx,dy);
    if(d>R){m.bx=m.x-dx/d*R;m.by=m.y-dy/d*R;dx=dx/d*R;dy=dy/d*R;}mx=dx/R;my=dy/R;}
  if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
  if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  const a=sticks.aim;
  if(a){const dx=a.x-a.bx,dy=a.y-a.by,d=Math.hypot(dx,dy);
    if(d>R){a.bx=a.x-dx/d*R;a.by=a.y-dy/d*R;}
    if(d>10){aim=Math.atan2(dy,dx);fire=true;touchAim=true;}}
  else if(mouse.used&&!touchUsed){const px=(player.x-camX)*S+W/2,py=(player.y-camY)*S+H/2;
    aim=Math.atan2(mouse.y-py,mouse.x-px);fire=mouse.down;}
  return{mx,my,aim,fire,touchAim};}
function assist(aim,aaMode){let bestA=null,bd=aaMode?.34:.25;const rng=aaMode?1000:560;
  const g=aaMode?player.aa:null,G=g?CFG.aaGuns[g.type]:null;
  const ox=g?g.x:player.x,oy=g?g.y:player.y;
  for(const e of enemies){if(e.dead)continue;if(aaMode?!e.air:e.air)continue;
    let ex=e.x,ey=e.y;
    if(G&&e.A){const tt=Math.hypot(ex-ox,ey-oy)/G.spd;   // 弾着までの偏差を見込む
      ex+=Math.cos(e.ang)*e.A.speed*tt;ey+=Math.sin(e.ang)*e.A.speed*tt;}
    const dx=ex-ox,dy=ey-oy;if(dx*dx+dy*dy>rng*rng)continue;
    const ea=Math.atan2(dy,dx),df=Math.abs(angDiff(aim,ea));if(df<bd){bd=df;bestA=ea;}}
  return bestA===null?aim:bestA;}

// ---------- パーティクル ----------
function addP(o){const p=Object.assign({vx:0,vy:0,life:.5,size:3,color:'#fff',kind:'dot',grow:0,drag:0},o);
  if(o.max===undefined)p.max=p.life;particles.push(p);if(particles.length>700)particles.shift();}
function sparks(x,y,n,col){for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(60,260);
  addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.15,.35),size:rand(1.5,3),color:col||'#ffd27a',drag:4});}}
function smoke(x,y,n,sz){for(let i=0;i<n;i++)addP({x:x+rand(-8,8),y:y+rand(-8,8),vx:rand(-30,30),vy:rand(-30,30),
  life:rand(.6,1.4),size:rand(sz*.5,sz),grow:sz*.8,color:'#6b6b63',kind:'smoke',drag:1.5});}
function popText(x,y,text,color){addP({x,y,vy:-40,life:1.1,kind:'text',text,color});}
function explodeFx(x,y,rad){shake=Math.max(shake,rad/9);
  addP({x,y,life:.18,size:rad*.9,color:'#fff3c0',kind:'flash'});

    addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),size:rand(rad*.12,rad*.28),grow:rad*.2,
      color:Math.random()<.5?'#ff9a2e':'#ffcf4a',kind:'fire',drag:3});}
  smoke(x,y,14,rad*.35);sparks(x,y,14,'#ffb347');

function addDecal(d){decals.push(d);if(decals.length>90)decals.shift();}

// ---------- ダメージ ----------
function explode(x,y,rad,dmg,src,hard){explodeFx(x,y,rad);
  if(src==='e'){const mul=hard?4:1;   // 陣地・対空砲へのダメージ（貫通爆弾は4倍）
    for(const f of forts.slice()){const d=Math.hypot(f.x-x,f.y-y);
      if(d<rad+30)hurtFortObj(f,dmg*mul*(1-.5*clamp(d/(rad+30),0,1)));}
    for(const g of aas.slice()){const d=Math.hypot(g.x-x,g.y-y);
      if(d<rad+30)hurtAAObj(g,dmg*mul*(1-.5*clamp(d/(rad+30),0,1)));}}
  if(src!=='e')for(const e of enemies){if(e.dead||e.air)continue;const d=Math.hypot(e.x-x,e.y-y);
    if(d<rad+e.r)hurtEnemy(e,dmg*(1-.6*clamp(d/(rad+e.r),0,1)),true,x,y);}
  if(state==='play'&&src!=='a'&&!player.inCar){const p=player,d=Math.hypot(p.x-x,p.y-y);
    if(d<rad+p.r)hurtPlayer(dmg*(1-.6*clamp(d/(rad+p.r),0,1))*(src==='p'?.4:1));}
  if(src==='e')for(const a of allies){if(a.down||a.riding)continue;const d=Math.hypot(a.x-x,a.y-y);
    if(d<rad+a.r)hurtAlly(a,dmg*(1-.6*clamp(d/(rad+a.r),0,1)));}
  if(src!=='a')for(const c of cars){if(!c||c.dead)continue;const d=Math.hypot(c.x-x,c.y-y);
    if(d<rad+34)hurtCar(c,dmg*(1-.6*clamp(d/(rad+34),0,1))*(src==='p'?.3:1));}
  for(const o of obstacles){if(o.hp===Infinity)continue;const nx=clamp(x,o.x,o.x+o.w),ny=clamp(y,o.y,o.y+o.h);
    if(Math.hypot(x-nx,y-ny)<rad)hurtObstacle(o,dmg*1.2);}
  obstacles=obstacles.filter(o=>o.hp>0);}
function hurtObstacle(o,d){if(o.hp<=0)return;o.hp-=d;if(o.hp<=0){o.hp=0;
  for(let i=0;i<10;i++)addP({x:o.x+rand(0,o.w),y:o.y+rand(0,o.h),vx:rand(-120,120),vy:rand(-120,120),life:rand(.4,.9),
    size:rand(3,6),color:o.type==='crate'?'#7a5428':o.type==='tree'?'#4e6b32':'#a58a5a',kind:'debris',drag:3});
  smoke(o.x+o.w/2,o.y+o.h/2,6,18);}}
function hurtEnemy(e,dmg,expl,hx,hy){if(e.dead)return;if(e.type==='tank'&&!expl)dmg*=CFG.tankBulletMul;
  if(e.V&&!expl)dmg*=e.V.armor;
  if(e.V&&expl&&e.V.rocketRes)dmg*=1-e.V.rocketRes;
  if(e.V&&e.V.frontArc&&hx!==undefined){const df=Math.abs(angDiff(e.ang,Math.atan2(hy-e.y,hx-e.x)));
    if(df<1.05){dmg*=e.V.frontArc;if(Math.random()<.3)sparks(hx,hy,5,'#cfe8ff');}
    else if(df>2.2){dmg*=e.V.rearMul||1.8;popText(hx,hy,'弱点！','#ffd45a');}}
  e.hp-=dmg;e.hurt=.08;if(e.hp<=0)killEnemy(e);}
function killEnemy(e){e.dead=true;score+=e.score;dropLoot(e);
  if(e.boss){for(let i=0;i<3;i++)explodeFx(e.x+rand(-40,40),e.y+rand(-40,40),90);
    popText(e.x,e.y-50,'BOSS 撃破！','#ffd45a');
    const up=rollUp();if(up)pickups.push({x:e.x+rand(-30,30),y:e.y+rand(-30,30),type:up,t:40,bob:0});
    pickups.push({x:e.x+rand(-40,40),y:e.y+rand(-40,40),type:rollWeapon(true),t:30,bob:1});
    pickups.push({x:e.x+rand(-40,40),y:e.y+rand(-40,40),type:'health',t:30,bob:2});
    pickups.push({x:e.x+rand(-40,40),y:e.y+rand(-40,40),type:'grenade',t:30,bob:3});
    pickups.push({x:e.x+rand(-40,40),y:e.y+rand(-40,40),type:'repair',t:30,bob:4});}
  if(e.V){score+=e.riders.length*100;if(e.riders.length)popText(e.x,e.y-38,'乗員ごと撃破！','#ffd45a');
    else if(e.type!=='jeep')popText(e.x,e.y-38,e.name+' 撃破！','#ffd45a');
    addDecal(e.type==='jeep'?{kind:'carwreck',x:e.x,y:e.y,ang:e.ang,t:1e9,smk:10}:{kind:'vehwreck',x:e.x,y:e.y,ang:e.ang,tAng:e.tAng,V:e.V,t:1e9,smk:12});
    explode(e.x,e.y,e.V.len,Math.min(90,e.V.len*.8),'p');}
  else if(e.type==='tank'){addDecal({kind:'wreck',x:e.x,y:e.y,ang:e.body,tAng:e.tAng,t:1e9,smk:10});explode(e.x,e.y,90,70,'p');}
  else if(e.F){ // 陣地の制圧
    explodeFx(e.x,e.y,80);popText(e.x,e.y-40,e.name+' 制圧！','#ffd45a');
    addDecal({kind:'rubble',x:e.x-26,y:e.y-26,w:52,h:52,seed:e.seed||Math.random(),t:1e9});
    for(let i=0;i<14;i++)addP({x:e.x+rand(-20,20),y:e.y+rand(-20,20),vx:rand(-150,150),vy:rand(-150,150),
      life:rand(.5,1.1),size:rand(3,8),color:'#a58a5a',kind:'debris',drag:3});
    sfx('boom',.9);shake=Math.max(shake,6);}
  else if(e.air){ // 撃墜
    for(let i=0;i<3;i++)explodeFx(e.x+rand(-34,34),e.y+rand(-34,34),74);
    popText(e.x,e.y-44,e.name+' 撃墜！','#ffd45a');
    addDecal({kind:'scorch',x:e.x,y:e.y,r:48,t:1e9});
    explode(e.x,e.y,110,60,'p');sfx('boom',1);shake=Math.max(shake,8);}
  else{addDecal({kind:'corpse',x:e.x,y:e.y,ang:e.ang,col:e.type==='gunner'?'#4a3528':'#5a4a34',t:25});sparks(e.x,e.y,6,'#c9b48a');}}
function hurtPlayer(d){if(state!=='play')return;if(player.inCar){hurtCar(car,d);return;}const p=player;p.hp-=d;p.hurt=.25;shake=Math.max(shake,4);
  if(p.hp<=0){p.hp=0;gameOver();}}
function gameOver(){state='over';overT=0;best=Math.max(best,score);sticks.move=sticks.aim=null;explodeFx(player.x,player.y,45);}
function weaponPool(){const p=[];for(const k in CFG.weapons){const w=CFG.weapons[k];if(w.tier&&wave>=w.wave)p.push(k);}
  const rk=new Map(p.map(k=>[k,Math.random()]));   // 同じtier内は毎回シャッフル
  p.sort((a,b)=>(CFG.weapons[a].tier-CFG.weapons[b].tier)||(rk.get(a)-rk.get(b)));return p;}
function rollWeapon(best){const p=weaponPool();if(!p.length)return 'mg';
  const n=p.length,r=Math.random();
  let i=best?n-1-Math.floor(r*r*Math.min(n,3)):Math.floor(n*(.35+.65*Math.sqrt(r)));
  return p[clamp(i,0,n-1)];}
function upAvailable(k){return k==='wup'?player.baseLvl<CFG.baseWeapons.length-1
  :k==='cup'?carLvl<CFG.carUpgrades.length-1:allyLvl<CFG.allyUpgrades.length-1;}
function rollUp(){const o=[];if(upAvailable('wup'))o.push('wup');if(upAvailable('sup'))o.push('sup');if(upAvailable('cup'))o.push('cup');
  return o.length?o[Math.floor(Math.random()*o.length)]:null;}
function dropLoot(e){let t=null,heavy=e.type==='tank'||e.V||e.air||e.F;
  if(heavy){const r=Math.random();
    if(r<CFG.upDropHeavy)t=rollUp();
    if(!t){const r2=Math.random();t=r2<.18?'health':r2<.30?'grenade':r2<.30+CFG.repairDropHeavy?'repair':rollWeapon(true);}}
  else{const r=Math.random();
    if(r<CFG.upDropSoldier)t=rollUp();
    if(!t){if(r<.14)t='health';else if(r<.22)t='grenade';
      else if(r<.22+CFG.repairDropSoldier)t='repair';
      else if(r<.22+CFG.repairDropSoldier+CFG.weaponDropRate)t=rollWeapon(false);}}
  if(t)pickups.push({x:e.x,y:e.y,type:t,t:(t==='wup'||t==='sup'||t==='cup')?30:(t==='repair'?24:15),bob:rand(0,6)});}

// ---------- プレイヤー ----------
function playerFire(){const p=player,w=CFG.weapons[p.weapon];p.fireCd=w.rate;
  const mx=p.x+Math.cos(p.ang)*24,my=p.y+Math.sin(p.ang)*24;
  for(let i=0;i<w.pellets;i++){const a=p.ang+rand(-w.spread,w.spread),s=w.spd*(w.pellets>1?rand(.85,1.1):1);
    const b={x:mx,y:my,vx:Math.cos(a)*s,vy:Math.sin(a)*s,dmg:w.dmg,owner:'p',life:w.life};
    if(w.rad){b.rocket=true;b.rad=w.rad;}
    if(w.pierce){b.pierce=w.pierce;b.hit=[];}
    if(w.ap)b.ap=true;
    if(w.flame){b.flame=true;b.dmg=w.dmg;}
    bullets.push(b);}
  addP({x:mx,y:my,life:.05,size:w.flame?9:(w.rad?14:(w.pellets>1?11:7)),color:w.flame?'#ff9a3a':'#ffe08a',kind:'flash'});
  if(!w.flame){const back=p.ang+Math.PI;for(let i=0;i<(w.rad?4:1);i++)
    addP({x:mx,y:my,vx:Math.cos(back)*rand(30,90),vy:Math.sin(back)*rand(30,90),life:.3,size:4,grow:8,color:'#7a7a70',kind:'smoke'});}
  shake=Math.max(shake,w.shake||1);
  sfx(w.rad?'cannon':'shot',w.rad?.8:(w.pellets>1?1.4:1));}
function throwGrenade(){if(state!=='play')return;const p=player;if(p.gren<=0||p.grenCd>0)return;
  p.gren--;p.grenCd=.6;const a=p.ang;let dist=0;
  while(dist<CFG.grenadeRange){const nx=p.x+Math.cos(a)*(dist+10),ny=p.y+Math.sin(a)*(dist+10);

function updatePlayer(dt,inp){const p=player;

const SEATS={driver:{x:0,y:10},riders:[{x:-20,y:-12},{x:-20,y:12},{x:-34,y:0}]};
function seatPos(c,s){const co=Math.cos(c.ang),si=Math.sin(c.ang);return{x:c.x+co*s.x-si*s.y,y:c.y+si*s.x+co*s.y};}
const CAR_NAMES=['1号車','2号車','3号車'];
function carLv(){return CFG.carUpgrades[clamp(carLvl,0,CFG.carUpgrades.length-1)];}
function carForm(){return carLv().form||null;}
function carMaxHp(){return CFG.car.hp+carLv().hp;}
function carSeatDef(c,i){return c.V?vehSeats(c.V)[i]:SEATS.riders[i];}
function carSeat(c,i){return seatPos(c,carSeatDef(c,i));}
function applyCarLevel(){const m=carMaxHp(),f=carForm();
  for(const c of cars){if(!c)continue;c.hp=Math.min(m,c.hp+(m-c.maxHp));c.maxHp=m;c.V=f;
    if(f&&carBlocked(c))relocateCar(c,c.x,c.y);}}
function upgradeCars(){if(carLvl>=CFG.carUpgrades.length-1)return false;

function makeCar(x,y,ang,name){return{name:name||CAR_NAMES[0],x,y,ang,revT:0,revSteer:1,stuckT:1.2,lostT:0,speed:0,steer:0,hp:carMaxHp(),maxHp:carMaxHp(),hurt:0,dead:false,V:carForm(),
  gAng:ang,mgCd:rand(.4,1.2),mgBurst:0,mgCheckT:0,mgTgt:null,gunner:null,mgFlash:0};}
function vehHalf(c){return c.V?{L:c.V.len/2,Wd:c.V.wid/2}:{L:46,Wd:21};}
function carCircles(c){const {L,Wd}=vehHalf(c),co=Math.cos(c.ang),si=Math.sin(c.ang);
  const n=Math.max(2,Math.round(L/Wd)),out=[];
  for(let i=0;i<n;i++){const o=-(L-Wd)+(n>1?(L-Wd)*2*i/(n-1):0);out.push({x:c.x+co*o,y:c.y+si*o,r:Wd});}
  return out;}
function vehSeats(V){const n=V.riders,out=[],back=-V.len/2+16,rows=Math.ceil(n/2);
  for(let i=0;i<n;i++){const r=Math.floor(i/2),side=(i%2)?1:-1;
    out.push({x:back+(rows>1?r*(V.len*.32/(rows-1||1)):0)+8,y:n===1?0:side*(V.wid*.26)});}
  if(n===3)return[{x:-V.len*.22,y:-V.wid*.28},{x:-V.len*.22,y:V.wid*.28},{x:-V.len*.37,y:0}];

function carAt(x,y){for(const c of cars)if(c&&!c.dead&&inCarRect(c,x,y))return c;return null;}

function updateCarMg(c,dt){if(!c||c.dead)return;

// ---------- 対空砲 ----------

function hurtCar(c,d){if(!c||c.dead)return;c.hp-=d*(carLv().armor||1);c.hurt=.08;if(c.hp<=0){c.hp=0;destroyCar(c);}}
function destroyCar(c){c.dead=true;const wasIn=c===car&&player.inCar,riders=allies.filter(a=>a.riding&&a.vehicle===c);

function carVsObstacles(c,onCrash){let hit=false;
  for(let it=0;it<2;it++)for(let k=0;k<2;k++){const q=carCircles(c)[k];
    for(const o of obstacles){if(o.hp<=0)continue;
      const nx=clamp(q.x,o.x,o.x+o.w),ny=clamp(q.y,o.y,o.y+o.h),dx=q.x-nx,dy=q.y-ny,d2=dx*dx+dy*dy;
      if(d2>=q.r*q.r)continue;

      let px=0,py=0;
      if(d2<1e-6){const l=q.x-o.x,r=o.x+o.w-q.x,t=q.y-o.y,b=o.y+o.h-q.y,m=Math.min(l,r,t,b);
        if(m===l)px=-(l+q.r);else if(m===r)px=r+q.r;else if(m===t)py=-(t+q.r);else py=b+q.r;}
      else{const d=Math.sqrt(d2);px=dx/d*(q.r-d);py=dy/d*(q.r-d);}
      c.x+=px;c.y+=py;q.x+=px;q.y+=py;hit=true;}
    if(q.x<q.r){c.x+=q.r-q.x;hit=true;}if(q.y<q.r){c.y+=q.r-q.y;hit=true;}
    if(q.x>WORLD-q.r){c.x-=q.x-(WORLD-q.r);hit=true;}if(q.y>WORLD-q.r){c.y-=q.y-(WORLD-q.r);hit=true;}}
  if(hit){if(Math.abs(c.speed)>230){const sg=Math.sign(c.speed);(onCrash||(v=>hurtCar(c,v)))(Math.abs(c.speed)*.06);if(c===car)shake=Math.max(shake,5);

function updateCar(c,dt,inp){const C=CFG.car,L=carLv();c.hurt-=dt;let throttle=0,steer=0;

function probe(c,a,max){const fx=c.x+Math.cos(c.ang)*40,fy=c.y+Math.sin(c.ang)*40;

  const fr=[];if(state==='play'&&!player.inCar)fr.push(player);for(const a of allies)if(!a.down&&!a.riding)fr.push(a);

      if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),o=(rr-d)/2,wa=a.type==='tank'?.2:a.V?.3:1,wb=b.type==='tank'?.2:b.V?.3:1;
        a.x-=dx/d*o*wa;a.y-=dy/d*o*wa;b.x+=dx/d*o*wb;b.y+=dy/d*o*wb;}}
    if(!a.V)for(const f of fr){const dx=f.x-a.x,dy=f.y-a.y,rr=a.r+f.r,d2=dx*dx+dy*dy;
      if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),o=rr-d;
        if(a.type==='tank'){f.x+=dx/d*o;f.y+=dy/d*o;}
        else{a.x-=dx/d*o*.5;a.y-=dy/d*o*.5;f.x+=dx/d*o*.5;f.y+=dy/d*o*.5;}
        pushOut(f);}}}
  for(let i=0;i<fr.length;i++)for(let j=i+1;j<fr.length;j++){const a=fr[i],b=fr[j],dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;
    if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),o=rr-d,wa=a===player?0:.5,wb=a===player?1:.5;
      a.x-=dx/d*o*wa;a.y-=dy/d*o*wa;b.x+=dx/d*o*wb;b.y+=dy/d*o*wb;pushOut(a);pushOut(b);}}
  for(const cc of cars){if(!cc||cc.dead)continue;const cs=carCircles(cc),mine=cc===car;
    for(const e of enemies){if(e.dead)continue;for(const q of cs){const dx=e.x-q.x,dy=e.y-q.y,rr=e.r+q.r,d2=dx*dx+dy*dy;
      if(d2>=rr*rr||d2<.01)continue;const d=Math.sqrt(d2),o=rr-d;
      if(e.V){cc.x-=dx/d*o*.5;cc.y-=dy/d*o*.5;e.x+=dx/d*o*.5;e.y+=dy/d*o*.5;const rv=Math.abs(cc.speed)+Math.abs(e.speed);
        if(rv>150&&e.bumpT<=0){hurtCar(cc,rv*.05);hurtEnemy(e,rv*.4,true);e.bumpT=.6;if(mine)shake=Math.max(shake,5);sparks((cc.x+e.x)/2,(cc.y+e.y)/2,10,'#ffd27a');}
        cc.speed*=.5;e.speed*=.3;}
      else if(e.type==='tank'){cc.x-=dx/d*o;cc.y-=dy/d*o;if(Math.abs(cc.speed)>90){hurtCar(cc,Math.abs(cc.speed)*.06);if(mine)shake=Math.max(shake,5);}cc.speed*=.3;}
      else{if(Math.abs(cc.speed)>110){hurtEnemy(e,Math.abs(cc.speed)*CFG.car.ramDmg,true);cc.speed*=.9;sparks(e.x,e.y,5,'#c9b48a');}
        e.x+=dx/d*o;e.y+=dy/d*o;pushOut(e);}}}
    for(const f of fr)for(const q of cs){const dx=f.x-q.x,dy=f.y-q.y,rr=f.r+q.r,d2=dx*dx+dy*dy;
      if(d2>=rr*rr||d2<.01)continue;const d=Math.sqrt(d2),o=rr-d;f.x+=dx/d*o;f.y+=dy/d*o;pushOut(f);}}
  enemies=enemies.filter(e=>!e.dead);}

// ---------- 弾・手榴弾・アイテム ----------
function bulletBoom(b){explode(b.x,b.y,b.rad,b.dmg,b.owner==='e'?'e':'a');}
function updateBullets(dt){let obsChanged=false;const fr=[player,...allies];
  for(const b of bullets){if(b.dead)continue;const ex=b.shell||b.rocket,steps=ex?1:2;
    if(ex&&Math.random()<.4)addP({x:b.x,y:b.y,life:.4,size:4,grow:10,color:'#8a8a80',kind:'smoke'});
    if(b.homing){const t=b.homing;
      if(t.dead||(t===player&&state!=='play')||(t.down))b.homing=null;
      else{const want=Math.atan2(t.y-b.y,t.x-b.x),cur=Math.atan2(b.vy,b.vx),na=cur+clamp(angDiff(cur,want),-b.turn*dt,b.turn*dt);
        b.vx=Math.cos(na)*b.spd;b.vy=Math.sin(na)*b.spd;}
      addP({x:b.x,y:b.y,life:.5,size:5,grow:14,color:'#8a8a80',kind:'smoke'});}
    if(b.flame){addP({x:b.x,y:b.y,vx:b.vx*.15,vy:b.vy*.15,life:rand(.12,.3),size:rand(5,9),grow:22,color:Math.random()<.5?'#ff9a2e':'#ffd24a',kind:'fire',drag:3});
      if(Math.random()<.2)addP({x:b.x,y:b.y,life:.6,size:6,grow:18,color:'#5a5a52',kind:'smoke'});}
    if(b.ap&&Math.random()<.6)addP({x:b.x,y:b.y,life:.15,size:3,color:'#bfe4ff',kind:'flash'});
    for(let s=0;s<steps&&!b.dead;s++){b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;
      const o=solidAt(b.x,b.y,false);
      if(o){b.dead=true;
        if(ex)bulletBoom(b);
        else{sparks(b.x,b.y,b.flame?2:4,o.type==='building'?'#dddccc':'#e8cf96');if(o.hp!==Infinity){hurtObstacle(o,b.dmg*(b.ap?2:.5));obsChanged=true;}}
        break;}
      if(b.owner!=='e'){for(const e of enemies){if(e.dead)continue;
          if(e.air&&!b.aa)continue;                      // 航空機は対空砲の弾でしか当たらない
          if(b.hit&&b.hit.includes(e))continue;const dx=e.x-b.x,dy=e.y-b.y;
          const hr=e.r+(e.air&&b.prox?b.prox:0);
          if(e.V?inCarRect(e,b.x,b.y):dx*dx+dy*dy<hr*hr){
            if(ex){b.dead=true;bulletBoom(b);break;}
            hurtEnemy(e,b.dmg,b.ap,b.x,b.y);sparks(b.x,b.y,b.ap?8:4,e.type==='tank'||e.V?'#fff2a8':'#b04030');
            if(b.pierce>0){b.pierce--;b.hit.push(e);b.dmg*=.9;}else{b.dead=true;break;}}}}
      else if(carAt(b.x,b.y)){const hc=carAt(b.x,b.y);b.dead=true;if(ex)bulletBoom(b);else{hurtCar(hc,b.dmg);sparks(b.x,b.y,4,'#e8e0c0');}}
      else{for(const f of fr){if(f===player?(state!=='play'||player.inCar):(f.down||f.riding))continue;const dx=f.x-b.x,dy=f.y-b.y;
          if(dx*dx+dy*dy<f.r*f.r){b.dead=true;
            if(ex)bulletBoom(b);else{if(f===player)hurtPlayer(b.dmg);else hurtAlly(f,b.dmg);sparks(b.x,b.y,4,'#b04030');}break;}}}}
    b.life-=dt;if(!b.dead&&b.life<=0){b.dead=true;if(ex)bulletBoom(b);}}
  bullets=bullets.filter(b=>!b.dead);if(obsChanged)obstacles=obstacles.filter(o=>o.hp>0);}
function bombBlast(x,y,rad,dmg,bunker){explode(x,y,rad,dmg,'e',bunker);
  if(bunker){for(let i=0;i<4;i++)explodeFx(x+rand(-40,40),y+rand(-40,40),rad*.6);
    addDecal({kind:'scorch',x,y,r:rad*.55,t:1e9});shake=Math.max(shake,12);sfx('boom',1);}
  let broke=0;
  for(const o of obstacles){if(o.type!=='building')continue;
    const nx=clamp(x,o.x,o.x+o.w),ny=clamp(y,o.y,o.y+o.h);
    if(Math.hypot(x-nx,y-ny)>rad*.9)continue;
    o.hp=0;broke++;addDecal({kind:'rubble',x:o.x,y:o.y,w:o.w,h:o.h,seed:o.seed||Math.random(),t:1e9});
    for(let i=0;i<18;i++)addP({x:o.x+rand(0,o.w),y:o.y+rand(0,o.h),vx:rand(-170,170),vy:rand(-170,170),
      life:rand(.5,1.2),size:rand(4,9),color:'#9b9184',kind:'debris',drag:3});
    smoke(o.x+o.w/2,o.y+o.h/2,12,32);}
  if(broke){obstacles=obstacles.filter(o=>o.hp>0);shake=Math.max(shake,8);
    popText(x,y-30,'建物が吹き飛んだ！','#ffb0a0');}}
function updateGrenades(dt){for(const g of grenades){g.t+=dt;const k=Math.min(1,g.t/g.dur);
    g.x=g.sx+(g.tx-g.sx)*k;g.y=g.sy+(g.ty-g.sy)*k;
    g.h=g.bomb?(1-k)*72:Math.sin(k*Math.PI)*(20+g.dist*.18);
    if(k>=1){g.fuse-=dt;if(g.fuse<=0){g.dead=true;
      if(g.bomb)bombBlast(g.x,g.y,g.rad,g.dmg,g.bunker);
      else explode(g.x,g.y,g.rad||CFG.grenadeRadius,g.dmg||CFG.grenadeDmg,g.src||'p');}}}
  grenades=grenades.filter(g=>!g.dead);}
function updatePickups(dt){const p=player;
  for(const k of pickups){k.t-=dt;if(k.t<=0){k.dead=true;continue;}
    const up=k.type==='wup'||k.type==='sup'||k.type==='cup';
    const pr=p.inCar?48:p.r+18,px=p.inCar&&car?car.x:p.x,py=p.inCar&&car?car.y:p.y;
    if(state==='play'){const dx=px-k.x,dy=py-k.y,d=Math.hypot(dx,dy)||1,mr=up?260:150;

    if(state==='play'&&Math.hypot(k.x-px,k.y-py)<pr){k.dead=true;sfx('pickup');

        if(live.length){for(const c of live){c.hp=Math.min(c.maxHp,c.hp+amt);sparks(c.x,c.y,8,'#c8c070');}
          popText(px,py-30,'車両 修理 +'+amt,'#dfe8a0');}
        else{spawnCarNear(0,p.x,p.y);shake=Math.max(shake,3);}}
      else if(k.type==='wup'){if(!upgradePlayer()){score+=1500;popText(p.x,p.y-24,'最大強化済み +1500','#ffd45a');}}
      else if(k.type==='sup'){if(!upgradeAllies()){score+=1500;popText(p.x,p.y-24,'仲間は最大強化済み +1500','#9fd8ff');}}
      else if(k.type==='cup'){if(!upgradeCars()){score+=1500;popText(p.x,p.y-24,'車両は最大強化済み +1500','#ffb060');}}
      else{const w=CFG.weapons[k.type];p.weapon=k.type;p.wTime=w.time||CFG.powerupTime;
        popText(p.x,p.y-24,w.name+'！','#ffd45a');shake=Math.max(shake,3);}}}
  pickups=pickups.filter(k=>!k.dead);}
function updateDecals(dt){for(const d of decals){
    if(d.kind==='corpse')d.t-=dt;

function updateHazards(dt){for(const h of hazards){h.t-=dt;h.r=Math.min(h.max,h.r+dt*30);

function updateParticles(dt){for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;

function relocateCar(c,x,y){for(let t=0;t<80;t++){const ox=c.x,oy=c.y,oa=c.ang,a=rand(0,TAU),d=rand(70,260);
    c.x=clamp(x+Math.cos(a)*d,60,WORLD-60);c.y=clamp(y+Math.sin(a)*d,60,WORLD-60);c.ang=rand(0,TAU);
    if(!carBlocked(c))return true;
    c.x=ox;c.y=oy;c.ang=oa;}
  return false;}
function applyStage(n,first){
  const def=stageFor(n),idx=CFG.stages.indexOf(def);
  if(!first&&idx===stageIdx)return false;
  stageIdx=idx;
  genMap(def,first?WORLD/2:player.x,first?WORLD/2:player.y);
  if(!first){ // 新しい地形にめり込まないよう押し出す
    pushOut(player);
    for(const a of allies)if(!a.riding)pushOut(a);
    for(const c of cars)if(c&&!c.dead&&carBlocked(c))relocateCar(c,player.x,player.y);
    decals=[];hazards=[];}
  return true;}

  updateHazards(dt);updateDecals(dt);updateParticles(dt);

    if(p.kind==='smoke'){ctx.globalAlpha=a*.45;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();}
    else if(p.kind==='text'){ctx.globalAlpha=a;ctx.font=`bold 14px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y);}
    else{ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}}
  ctx.globalCompositeOperation='lighter';
  for(const p of particles){if(p.kind!=='fire'&&p.kind!=='flash')continue;ctx.globalAlpha=clamp(p.life/p.max,0,1)*(p.kind==='flash'?.9:.7);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}
function txt(s,x,y,size,color,align){ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign=align||'left';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y);}
function drawStick(st,hx,hy,label){
  if(st){const dx=st.x-st.bx,dy=st.y-st.by,d=Math.hypot(dx,dy),k=d>55?55/d:1;
    ctx.fillStyle='rgba(20,24,16,.25)';ctx.beginPath();ctx.arc(st.bx,st.by,56,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(st.bx,st.by,55,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(st.bx+dx*k,st.by+dy*k,24,0,TAU);ctx.fill();}
  else if(touchUsed||!mouse.used){ctx.fillStyle='rgba(20,24,16,.18)';ctx.beginPath();ctx.arc(hx,hy,45,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx,hy,45,0,TAU);ctx.stroke();
    ctx.font=`bold 13px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillText(label,hx,hy);}}
function drawHUD(){
  if(state==='play'){
    for(const e of enemies){if(e.A&&e.A.stealth)continue;   // ステルス機は接近を知らせない
      const sx=(e.x-camX)*S+W/2,sy=(e.y-camY)*S+H/2;if(sx>-10&&sx<W+10&&sy>-10&&sy<H+10)continue;
      const d=Math.hypot(e.x-player.x,e.y-player.y);if(d>950)continue;
      const a=Math.atan2(sy-H/2,sx-W/2),c=Math.cos(a),s=Math.sin(a);
      const t=Math.min((W/2-22)/Math.max(Math.abs(c),1e-6),(H/2-22)/Math.max(Math.abs(s),1e-6));
      ctx.save();ctx.translate(W/2+c*t,H/2+s*t);ctx.rotate(a);ctx.globalAlpha=clamp(1.2-d/950,.25,.9);
      ctx.fillStyle=e.boss?'#ffd45a':e.air?'#bfe4ff':e.type==='tank'||(e.V&&e.V.tracked)?'#ffae3a':e.V?'#ff9a4a':'#ff5a4a';ctx.beginPath();ctx.moveTo(e.boss?14:10,0);ctx.lineTo(-6,-7);ctx.lineTo(-6,7);ctx.closePath();ctx.fill();ctx.restore();}
    for(const a of allies){if(!a.down)continue;const sx=(a.x-camX)*S+W/2,sy=(a.y-camY)*S+H/2;if(sx>-10&&sx<W+10&&sy>-10&&sy<H+10)continue;
      const an=Math.atan2(sy-H/2,sx-W/2),c=Math.cos(an),s=Math.sin(an);
      const t=Math.min((W/2-26)/Math.max(Math.abs(c),1e-6),(H/2-26)/Math.max(Math.abs(s),1e-6));
      ctx.save();ctx.translate(W/2+c*t,H/2+s*t);ctx.rotate(an);ctx.fillStyle='#4fb4ff';ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-7,-9);ctx.lineTo(-7,9);ctx.closePath();ctx.fill();ctx.restore();}
    if(car&&!car.dead&&!player.inCar){const sx=(car.x-camX)*S+W/2,sy=(car.y-camY)*S+H/2;
      if(sx<-10||sx>W+10||sy<-10||sy>H+10){const an=Math.atan2(sy-H/2,sx-W/2),c=Math.cos(an),s=Math.sin(an);
        const t=Math.min((W/2-26)/Math.max(Math.abs(c),1e-6),(H/2-26)/Math.max(Math.abs(s),1e-6));
        ctx.save();ctx.translate(W/2+c*t,H/2+s*t);ctx.rotate(an);ctx.fillStyle='#e8e0a0';ctx.fillRect(-8,-6,14,12);
        ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(6,-8);ctx.lineTo(6,8);ctx.closePath();ctx.fill();ctx.restore();}}
    const raid=enemies.some(e=>e.air&&!e.dead);
    if(raid&&!player.aa&&aas.length){ // 最寄りの対空砲を指す矢印
      const g=aaNear(player.x,player.y,1e9),sx=(g.x-camX)*S+W/2,sy=(g.y-camY)*S+H/2;
      if(sx<20||sx>W-20||sy<20||sy>H-20){const an=Math.atan2(sy-H/2,sx-W/2),c=Math.cos(an),si=Math.sin(an);
        const tl=Math.min((W/2-40)/Math.max(Math.abs(c),1e-6),(H/2-40)/Math.max(Math.abs(si),1e-6));
        ctx.save();ctx.translate(W/2+c*tl,H/2+si*tl);ctx.rotate(an);
        ctx.fillStyle=`rgba(143,224,255,${.55+.3*Math.sin(time*6)})`;
        ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-8,-10);ctx.lineTo(-8,10);ctx.closePath();ctx.fill();ctx.restore();}}
    const boss=enemies.find(e=>e.boss&&!e.dead);
    if(boss){const bw=Math.min(320,W*.72),bx=W/2-bw/2,by=12;
      ctx.fillStyle='rgba(20,16,12,.6)';rrect(bx-6,by-6,bw+12,30,7);ctx.fill();
      ctx.fillStyle='#2a2a24';ctx.fillRect(bx,by+10,bw,10);
      const r=clamp(boss.hp/boss.maxHp,0,1);ctx.fillStyle=boss.rage?'#ff7a3a':'#e04a3a';ctx.fillRect(bx,by+10,bw*r,10);
      ctx.strokeStyle='rgba(255,220,150,.6)';ctx.lineWidth=1;ctx.strokeRect(bx,by+10,bw,10);
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(bx+bw*.5,by+10,1,10);
      txt('BOSS　'+boss.name+(boss.rage?'　猛攻':''),W/2,by+3,12,'#ffd45a','center');
      if(boss.V.frontArc)txt('正面装甲が厚い　背後を狙え',W/2,by+30,10,'#ffb0a0','center');
      else if(boss.V.rocketRes)txt('爆発に強い　銃撃が有効',W/2,by+30,10,'#ffb0a0','center');
      const cnt=enemies.filter(e=>e.boss&&!e.dead).length;if(cnt>1)txt('×'+cnt,bx+bw+16,by+15,12,'#ffd45a');}
    if(raid&&!enemies.some(e=>e.boss&&!e.dead))
      txt(player.aa?'対空戦闘中　空を狙え':'空襲中！　対空砲（水色）へ',W/2,14,15,'#ffd45a','center');
    const p=player;
    if(p.hurt>0||p.hp<30){const a=p.hurt>0?.45:.25+.1*Math.sin(time*6);
      const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
      g.addColorStop(0,'rgba(180,0,0,0)');g.addColorStop(1,`rgba(180,0,0,${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}}
  if(state!=='title'){const p=player,x=14,y=14;
    ctx.fillStyle='rgba(20,24,14,.55)';rrect(x-4,y-4,190,84,8);ctx.fill();
    txt('HP',x+2,y+8,12,'#e8e2c8');ctx.fillStyle='#2a2a24';ctx.fillRect(x+28,y+2,150,12);
    const r=p.hp/p.maxHp;ctx.fillStyle=r>.5?'#7cc444':r>.25?'#e8c030':'#e04030';ctx.fillRect(x+28,y+2,150*r,12);
    txt(`ステージ${stageNo(wave)}　${stage?stage.name:''}`,x+2,y+28,12,'#f0dfa0');
    txt(`ウェーブ${waveInStage(wave)}/${CFG.stageWaves}　SCORE ${score}`,x+2,y+46,12,'#e8e2c8');
    const w=CFG.weapons[p.weapon],tmp=p.weapon!==p.base;
    txt(w.name+(tmp?` ${Math.ceil(p.wTime)}s`:'')+(p.baseLvl?`  基本+${p.baseLvl}`:''),x+2,y+65,12,tmp?(w.col||'#ffd45a'):'#e8e2c8');
    const sq=Math.max(1,Math.min(3,Math.ceil(allies.length/3)));
    const ay=y+88;ctx.fillStyle='rgba(20,24,14,.55)';rrect(x-4,ay-4,190,20+sq*18,8);ctx.fill();
    txt(carLv().short,x+40,ay+4,9,carLvl?'#ffb060':'rgba(232,226,200,.7)');txt(`仲間 ${allies.filter(a=>!a.down).length}/${CFG.allies.length} ${allyLv().label}`,x+108,ay+4,9,allyLvl?'#9fd8ff':'rgba(232,226,200,.7)');
    for(let k=0;k<sq;k++){const yy=ay+20+k*18,c=cars[k];txt(CAR_NAMES[k],x+2,yy,11,'#dfe8a0');
      if(!c||c.dead)txt('大破',x+40,yy,11,'#ff8a70');
      else{ctx.fillStyle='#2a2a24';ctx.fillRect(x+40,yy-4,60,8);ctx.fillStyle='#c8c070';ctx.fillRect(x+40,yy-4,60*c.hp/c.maxHp,8);}
      allies.filter(a=>a.squad===k).forEach((a,j)=>{const bx=x+108+j*24;
        if(a.down){if(Math.floor(time*3)%2){ctx.fillStyle='#ff5a4a';ctx.fillRect(bx,yy-4,20,8);}}
        else{ctx.fillStyle='#2a2a24';ctx.fillRect(bx,yy-4,20,8);ctx.fillStyle=['#4fb4ff','#7ce0a0','#ffd45a','#ff9a5a'][clamp(allyLvl,0,3)];ctx.fillRect(bx,yy-4,20*a.hp/a.maxHp,8);}});}
    const m=Math.min(110,W*.26),mx=W-m-12,my=12,k=m/WORLD;
    ctx.fillStyle='rgba(20,24,14,.6)';ctx.fillRect(mx,my,m,m);ctx.strokeStyle='rgba(232,226,200,.4)';ctx.lineWidth=1;ctx.strokeRect(mx,my,m,m);
    const mrect=(r,col)=>{const ax=clamp(r.x,0,WORLD),ay=clamp(r.y,0,WORLD),bx=clamp(r.x+r.w,0,WORLD),by=clamp(r.y+r.h,0,WORLD);
      ctx.fillStyle=col;ctx.fillRect(mx+ax*k,my+ay*k,Math.max(1,(bx-ax)*k),Math.max(1,(by-ay)*k));};
    for(const r of roads)mrect(r,'rgba(120,118,108,.55)');
    for(const w of waters)mrect(w,'rgba(70,135,168,.8)');
    for(const b of bridges)mrect(b,'rgba(198,168,112,.9)');
    ctx.fillStyle='rgba(200,190,170,.5)';for(const o of obstacles)if(o.type==='building')ctx.fillRect(mx+o.x*k,my+o.y*k,Math.max(1,o.w*k),Math.max(1,o.h*k));
    ctx.fillStyle='rgba(120,170,110,.45)';for(const o of obstacles)if(o.type==='tree')ctx.fillRect(mx+o.x*k,my+o.y*k,Math.max(1,o.w*k),Math.max(1,o.h*k));
    for(const e of enemies){if(e.A&&e.A.stealth)continue;   // ステルス機はミニマップに映らない
      ctx.fillStyle=e.boss?'#ffd45a':e.air?'#bfe4ff':e.type==='tank'?'#ffae3a':e.V?'#ff7a4a':'#ff5a4a';const s=e.boss?6:e.air?5:e.type==='tank'||e.V?4:2.5;ctx.fillRect(mx+e.x*k-s/2,my+e.y*k-s/2,s,s);}
    for(const a of allies){if(a.down&&Math.floor(time*4)%2)continue;ctx.fillStyle=a.down?'#fff':'#4fb4ff';ctx.fillRect(mx+a.x*k-1.5,my+a.y*k-1.5,3,3);}
    for(const f of forts){ctx.fillStyle='#a8e08a';ctx.fillRect(mx+f.x*k-2.5,my+f.y*k-2.5,5,5);}
    for(const g of aas){ctx.fillStyle=player.aa===g?'#ffd45a':'#8fe0ff';ctx.fillRect(mx+g.x*k-3,my+g.y*k-1,6,2);ctx.fillRect(mx+g.x*k-1,my+g.y*k-3,2,6);}
    for(const c of cars){if(!c||c.dead)continue;ctx.fillStyle='#e8e0a0';ctx.fillRect(mx+c.x*k-2.5,my+c.y*k-2.5,5,5);}
    ctx.fillStyle='#9f6';ctx.fillRect(mx+p.x*k-2,my+p.y*k-2,4,4);
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.strokeRect(mx+(camX-W/2/S)*k,my+(camY-H/2/S)*k,W/S*k,H/S*k);
    if(stage)txt(stage.name,mx+m/2,my+m+5,11,'#dfe8c8','center');}
  if(state==='play'){
    drawStick(sticks.move,90,H-100,player.inCar?'運転':'移動');drawStick(sticks.aim,W-120,H-100,'照準');
    const g=grenBtn(),p=player,ok=p.gren>0;
    ctx.fillStyle=ok?'rgba(70,85,45,.75)':'rgba(50,50,50,.5)';ctx.strokeStyle='rgba(232,226,200,.6)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle=ok?'#2f3a20':'#444';ctx.beginPath();ctx.ellipse(g.x,g.y+2,9,11,0,0,TAU);ctx.fill();ctx.fillStyle='#999';ctx.fillRect(g.x-3,g.y-12,6,4);
    txt('×'+p.gren,g.x,g.y+g.r+12,13,'#e8e2c8','center');
    if(carBtnVisible()){const b=carBtn();ctx.fillStyle='rgba(95,102,68,.85)';ctx.strokeStyle='rgba(232,226,200,.75)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.stroke();txt(player.inCar?'降りる':'乗る',b.x,b.y,13,'#fff','center');}
    if(aaBtnVisible()){const b=aaBtn();ctx.fillStyle=player.aa?'rgba(150,112,40,.85)':'rgba(95,102,68,.85)';
      ctx.strokeStyle='rgba(255,225,150,.8)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.stroke();
      txt(player.aa?'離れる':'対空砲',b.x,b.y,12,'#fff','center');}}
  if(banner){const a=clamp(banner.t,0,1);ctx.globalAlpha=a;
    txt(banner.text,W/2,H*.3,Math.min(46,W/9),'#f0dfa0','center');
    if(banner.sub)txt(banner.sub,W/2,H*.3+Math.min(40,W/10),15,'#e8e2c8','center');ctx.globalAlpha=1;}
  if(state==='title'){ctx.fillStyle='rgba(16,20,10,.62)';ctx.fillRect(0,0,W,H);
    const ts=Math.min(52,W/8);txt('戦場シューター',W/2,H*.26,ts,'#f0dfa0','center');
    const lines=['左側をドラッグ：移動','右側をドラッグ：狙って撃つ（照準補助あり）','手榴弾ボタン：土のうを越えて投げられる','敵が落とす武器は進むほど強くなる','↑アイテムで自分・仲間が強化。車両は進化する','1ステージ＝5ウェーブ。最後のウェーブはボス戦','ウェーブをクリアするたびに仲間が1人合流する','高機動車に近づいて「乗る」。味方も荷台から撃つ','荷台の仲間が機関銃座に付く（車両に有効）','ステージごとに戦場が変わる（河川・市街地ほか）','戦闘機は対空砲に付かないと落とせない（Rキー）'];
    lines.forEach((l,i)=>txt(l,W/2,H*.4+i*Math.min(26,H*.05),Math.min(16,W/28),'#e8e2c8','center'));
    if(Math.floor(time*2)%2===0)txt('タップでスタート',W/2,H*.8,22,'#fff','center');
    if(!('ontouchstart' in window))txt('PC：WASD 移動／マウスで狙ってクリック射撃／G 手榴弾／E 乗り降り',W/2,H*.9,12,'rgba(232,226,200,.7)','center');}
  if(state==='over'){ctx.fillStyle=`rgba(40,8,6,${Math.min(.6,overT)})`;ctx.fillRect(0,0,W,H);
    txt('作戦失敗',W/2,H*.33,Math.min(50,W/8),'#ff8a70','center');
    txt(`ステージ${stageNo(wave)} ウェーブ${waveInStage(wave)}　SCORE ${score}`,W/2,H*.45,20,'#f0dfa0','center');
    txt(`ベスト ${best}`,W/2,H*.52,16,'#e8e2c8','center');
    if(overT>.8&&Math.floor(time*2)%2===0)txt('タップでもう一度',W/2,H*.68,20,'#fff','center');}}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#20251a';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2+(Math.random()-.5)*shake,H/2+(Math.random()-.5)*shake);ctx.scale(S,S);ctx.translate(-camX,-camY);
  drawWorld();ctx.restore();drawHUD();}

applyStage(1,true);player=newPlayer();
let last=performance.now();
let fbGone=false;
function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();
  if(!fbGone){fbGone=true;const f=document.getElementById('fb');if(f)f.remove();}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
