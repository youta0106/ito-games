// ---------- サウンド ----------
let actx=null,noiseBuf=null;
function unlockAudio(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();
    const len=Math.floor(actx.sampleRate*1.6);noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}catch(e){actx=null;}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function sfx(type,vol=1){if(!actx||!noiseBuf)return;try{const t=actx.currentTime;
  if(type==='pickup'){const o=actx.createOscillator(),g=actx.createGain();o.type='square';
    o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.07);
    g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.2);return;}
  const src=actx.createBufferSource();src.buffer=noiseBuf;const f=actx.createBiquadFilter(),g=actx.createGain();
  src.connect(f);f.connect(g);g.connect(actx.destination);let dur=.1;
  if(type==='shot'){f.type='lowpass';f.frequency.value=3000;g.gain.setValueAtTime(.16*vol,t);dur=.08;}
  else if(type==='eshot'){f.type='lowpass';f.frequency.value=1600;g.gain.setValueAtTime(.1*vol,t);dur=.07;}
  else if(type==='boom'){f.type='lowpass';f.frequency.setValueAtTime(1000,t);f.frequency.exponentialRampToValueAtTime(60,t+.9);g.gain.setValueAtTime(.55*vol,t);dur=1;}
  else if(type==='cannon'){f.type='lowpass';f.frequency.setValueAtTime(700,t);f.frequency.exponentialRampToValueAtTime(80,t+.4);g.gain.setValueAtTime(.35*vol,t);dur=.45;}
  else if(type==='throw'){f.type='bandpass';f.frequency.value=900;g.gain.setValueAtTime(.05,t);dur=.12;}
  g.gain.exponentialRampToValueAtTime(.001,t+dur);src.start(t,Math.random()*.5,dur+.02);
}catch(e){}}

// ---------- マップ ----------
let obstacles=[],patches=[];
function genMap(){obstacles=[];patches=[];
  const C=WORLD/2;
  obstacles.push({x:C-130,y:C-110,w:90,h:22,type:'sandbag',hp:180,maxHp:180});
  obstacles.push({x:C+50,y:C+90,w:22,h:90,type:'sandbag',hp:180,maxHp:180});
  function overlaps(x,y,w,h,pad){for(const p of obstacles){if(x<p.x+p.w+pad&&x+w+pad>p.x&&y<p.y+p.h+pad&&y+h+pad>p.y)return true;}return false;}
  function place(w,h,type,hp,pad){for(let t=0;t<40;t++){const x=rand(80,WORLD-80-w),y=rand(80,WORLD-80-h);
    if(Math.abs(x+w/2-C)<w/2+170&&Math.abs(y+h/2-C)<h/2+170)continue;
    if(overlaps(x,y,w,h,pad))continue;
    obstacles.push({x,y,w,h,type,hp,maxHp:hp,seed:Math.random()});return;}}
  for(let i=0;i<16;i++)place(rand(130,250),rand(110,210),'building',Infinity,110);
  for(let i=0;i<34;i++){if(Math.random()<.5)place(rand(80,150),22,'sandbag',180,50);else place(22,rand(80,150),'sandbag',180,50);}
  for(let i=0;i<26;i++)place(34,34,'crate',90,40);
  for(let i=0;i<40;i++)patches.push({x:rand(0,WORLD),y:rand(0,WORLD),rx:rand(40,140),ry:rand(30,90),rot:rand(0,TAU)});
}
function solidAt(x,y,buildingsOnly){for(const o of obstacles){if((!buildingsOnly||o.type==='building')&&x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)return o;}return null;}
function circleBlocked(x,y,r){for(const o of obstacles){const nx=clamp(x,o.x,o.x+o.w),ny=clamp(y,o.y,o.y+o.h);if((x-nx)**2+(y-ny)**2<r*r)return true;}return false;}
function lineClear(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/16);
  for(let i=1;i<n;i++){if(solidAt(x1+(x2-x1)*i/n,y1+(y2-y1)*i/n,true))return false;}return true;}
function pushOut(e){for(const o of obstacles){const nx=clamp(e.x,o.x,o.x+o.w),ny=clamp(e.y,o.y,o.y+o.h);
    const dx=e.x-nx,dy=e.y-ny,d2=dx*dx+dy*dy;if(d2>=e.r*e.r)continue;
    if(d2<1e-6){const l=e.x-o.x,r=o.x+o.w-e.x,t=e.y-o.y,b=o.y+o.h-e.y,m=Math.min(l,r,t,b);
      if(m===l)e.x=o.x-e.r;else if(m===r)e.x=o.x+o.w+e.r;else if(m===t)e.y=o.y-e.r;else e.y=o.y+o.h+e.r;}
    else{const d=Math.sqrt(d2);e.x+=dx/d*(e.r-d);e.y+=dy/d*(e.r-d);}}
  e.x=clamp(e.x,e.r,WORLD-e.r);e.y=clamp(e.y,e.r,WORLD-e.r);}
function moveEntity(e,dx,dy){e.x+=dx;e.y+=dy;pushOut(e);}

function grenBtn(){return{x:W-66,y:Math.max(120,H-215),r:34};}
cv.addEventListener('touchstart',e=>{e.preventDefault();unlockAudio();touchUsed=true;
  if(state!=='play'){handleTap();return;}

    const cb=carBtn();if(carBtnVisible()&&Math.hypot(x-cb.x,y-cb.y)<cb.r+10){toggleCar();continue;}
    if(Math.hypot(x-g.x,y-g.y)<g.r+12){throwGrenade();continue;}
    if(x<W/2){if(!sticks.move)sticks.move={id:t.identifier,bx:x,by:y,x,y};}
    else if(!sticks.aim)sticks.aim={id:t.identifier,bx:x,by:y,x,y};}
},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();
  for(const t of e.changedTouches)for(const k of['move','aim']){const s=sticks[k];if(s&&s.id===t.identifier){s.x=t.clientX;s.y=t.clientY;}}
},{passive:false});
function tEnd(e){e.preventDefault();for(const t of e.changedTouches)for(const k of['move','aim']){const s=sticks[k];if(s&&s.id===t.identifier)sticks[k]=null;}}
cv.addEventListener('touchend',tEnd,{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.used=true;});
cv.addEventListener('mousedown',e=>{unlockAudio();if(state!=='play'){handleTap();return;}
  const cb=carBtn(),g=grenBtn();if(carBtnVisible()&&Math.hypot(e.clientX-cb.x,e.clientY-cb.y)<cb.r){toggleCar();return;}
  if(Math.hypot(e.clientX-g.x,e.clientY-g.y)<g.r){throwGrenade();return;}mouse.down=true;mouse.used=true;});
window.addEventListener('mouseup',()=>{mouse.down=false;});
window.addEventListener('keydown',e=>{keys[e.code]=true;unlockAudio();
  if(state!=='play'){if(e.code==='Enter'||e.code==='Space')handleTap();return;}
  if(e.code==='KeyG'||e.code==='Space'){throwGrenade();e.preventDefault();}
  if(e.code==='KeyE'||e.code==='KeyF')toggleCar();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

function readInput(){let mx=0,my=0,aim=null,fire=false,touchAim=false;const R=55;
  const m=sticks.move;if(m){let dx=m.x-m.bx,dy=m.y-m.by;const d=Math.hypot(dx,dy);
    if(d>R){m.bx=m.x-dx/d*R;m.by=m.y-dy/d*R;dx=dx/d*R;dy=dy/d*R;}mx=dx/R;my=dy/R;}
  if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
  if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  const a=sticks.aim;
  if(a){const dx=a.x-a.bx,dy=a.y-a.by,d=Math.hypot(dx,dy);
    if(d>R){a.bx=a.x-dx/d*R;a.by=a.y-dy/d*R;}
    if(d>10){aim=Math.atan2(dy,dx);fire=true;touchAim=true;}}
  else if(mouse.used&&!touchUsed){const px=(player.x-camX)*S+W/2,py=(player.y-camY)*S+H/2;
    aim=Math.atan2(mouse.y-py,mouse.x-px);fire=mouse.down;}
  return{mx,my,aim,fire,touchAim};}
function assist(aim){let bestA=null,bd=.25;
  for(const e of enemies){const dx=e.x-player.x,dy=e.y-player.y;if(dx*dx+dy*dy>560*560)continue;
    const ea=Math.atan2(dy,dx),df=Math.abs(angDiff(aim,ea));if(df<bd){bd=df;bestA=ea;}}
  return bestA===null?aim:bestA;}

// ---------- パーティクル ----------
function addP(o){const p=Object.assign({vx:0,vy:0,life:.5,size:3,color:'#fff',kind:'dot',grow:0,drag:0},o);
  if(o.max===undefined)p.max=p.life;particles.push(p);if(particles.length>700)particles.shift();}
function sparks(x,y,n,col){for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(60,260);
  addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.15,.35),size:rand(1.5,3),color:col||'#ffd27a',drag:4});}}
function smoke(x,y,n,sz){for(let i=0;i<n;i++)addP({x:x+rand(-8,8),y:y+rand(-8,8),vx:rand(-30,30),vy:rand(-30,30),
  life:rand(.6,1.4),size:rand(sz*.5,sz),grow:sz*.8,color:'#6b6b63',kind:'smoke',drag:1.5});}
function popText(x,y,text,color){addP({x,y,vy:-40,life:1.1,kind:'text',text,color});}
function explodeFx(x,y,rad){shake=Math.max(shake,rad/9);
  addP({x,y,life:.18,size:rad*.9,color:'#fff3c0',kind:'flash'});
  for(let i=0;i<18;i++){const a=rand(0,TAU),s=rand(40,rad*2.2);
    addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),size:rand(rad*.12,rad*.28),grow:rad*.2,
      color:Math.random()<.5?'#ff9a2e':'#ffcf4a',kind:'fire',drag:3});}
  smoke(x,y,14,rad*.35);sparks(x,y,14,'#ffb347');
  addDecal({kind:'scorch',x,y,r:rad*.7,t:1e9});
  const d=player?Math.hypot(player.x-x,player.y-y):0;sfx('boom',clamp(rad/90,.3,1)*clamp(1.2-d/1000,.2,1));}
function addDecal(d){decals.push(d);if(decals.length>90)decals.shift();}

// ---------- ダメージ ----------
function explode(x,y,rad,dmg,src){explodeFx(x,y,rad);
  if(src!=='e')for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-x,e.y-y);
    if(d<rad+e.r)hurtEnemy(e,dmg*(1-.6*clamp(d/(rad+e.r),0,1)),true,x,y);}
  if(state==='play'&&src!=='a'&&!player.inCar){const p=player,d=Math.hypot(p.x-x,p.y-y);
    if(d<rad+p.r)hurtPlayer(dmg*(1-.6*clamp(d/(rad+p.r),0,1))*(src==='p'?.4:1));}
  if(src==='e')for(const a of allies){if(a.down||a.riding)continue;const d=Math.hypot(a.x-x,a.y-y);
    if(d<rad+a.r)hurtAlly(a,dmg*(1-.6*clamp(d/(rad+a.r),0,1)));}
  if(src!=='a')for(const c of cars){if(!c||c.dead)continue;const d=Math.hypot(c.x-x,c.y-y);
    if(d<rad+34)hurtCar(c,dmg*(1-.6*clamp(d/(rad+34),0,1))*(src==='p'?.3:1));}
  for(const o of obstacles){if(o.hp===Infinity)continue;const nx=clamp(x,o.x,o.x+o.w),ny=clamp(y,o.y,o.y+o.h);
    if(Math.hypot(x-nx,y-ny)<rad)hurtObstacle(o,dmg*1.2);}
  obstacles=obstacles.filter(o=>o.hp>0);}
function hurtObstacle(o,d){if(o.hp<=0)return;o.hp-=d;if(o.hp<=0){o.hp=0;
  for(let i=0;i<10;i++)addP({x:o.x+rand(0,o.w),y:o.y+rand(0,o.h),vx:rand(-120,120),vy:rand(-120,120),life:rand(.4,.9),
    size:rand(3,6),color:o.type==='crate'?'#7a5428':'#a58a5a',kind:'debris',drag:3});
  smoke(o.x+o.w/2,o.y+o.h/2,6,18);}}
function hurtEnemy(e,dmg,expl,hx,hy){if(e.dead)return;if(e.type==='tank'&&!expl)dmg*=CFG.tankBulletMul;
  if(e.V&&!expl)dmg*=e.V.armor;
  if(e.V&&expl&&e.V.rocketRes)dmg*=1-e.V.rocketRes;
  if(e.V&&e.V.frontArc&&hx!==undefined){const df=Math.abs(angDiff(e.ang,Math.atan2(hy-e.y,hx-e.x)));
    if(df<1.05){dmg*=e.V.frontArc;if(Math.random()<.3)sparks(hx,hy,5,'#cfe8ff');}
    else if(df>2.2){dmg*=e.V.rearMul||1.8;popText(hx,hy,'弱点！','#ffd45a');}}
  e.hp-=dmg;e.hurt=.08;if(e.hp<=0)killEnemy(e);}
function killEnemy(e){e.dead=true;score+=e.score;dropLoot(e);
  if(e.boss){for(let i=0;i<3;i++)explodeFx(e.x+rand(-40,40),e.y+rand(-40,40),90);
    popText(e.x,e.y-50,'BOSS 撃破！','#ffd45a');
    const up=rollUp();if(up)pickups.push({x:e.x+rand(-30,30),y:e.y+rand(-30,30),type:up,t:40,bob:0});
    pickups.push({x:e.x+rand(-40,40),y:e.y+rand(-40,40),type:rollWeapon(true),t:30,bob:1});
    pickups.push({x:e.x+rand(-40,40),y:e.y+rand(-40,40),type:'health',t:30,bob:2});
    pickups.push({x:e.x+rand(-40,40),y:e.y+rand(-40,40),type:'grenade',t:30,bob:3});}
  if(e.V){score+=e.riders.length*100;if(e.riders.length)popText(e.x,e.y-38,'乗員ごと撃破！','#ffd45a');
    else if(e.type!=='jeep')popText(e.x,e.y-38,e.name+' 撃破！','#ffd45a');
    addDecal(e.type==='jeep'?{kind:'carwreck',x:e.x,y:e.y,ang:e.ang,t:1e9,smk:10}:{kind:'vehwreck',x:e.x,y:e.y,ang:e.ang,tAng:e.tAng,V:e.V,t:1e9,smk:12});
    explode(e.x,e.y,e.V.len,Math.min(90,e.V.len*.8),'p');}
  else if(e.type==='tank'){addDecal({kind:'wreck',x:e.x,y:e.y,ang:e.body,tAng:e.tAng,t:1e9,smk:10});explode(e.x,e.y,90,70,'p');}
  else{addDecal({kind:'corpse',x:e.x,y:e.y,ang:e.ang,col:e.type==='gunner'?'#4a3528':'#5a4a34',t:25});sparks(e.x,e.y,6,'#c9b48a');}}
function hurtPlayer(d){if(state!=='play')return;if(player.inCar){hurtCar(car,d);return;}const p=player;p.hp-=d;p.hurt=.25;shake=Math.max(shake,4);
  if(p.hp<=0){p.hp=0;gameOver();}}
function gameOver(){state='over';overT=0;best=Math.max(best,score);sticks.move=sticks.aim=null;explodeFx(player.x,player.y,45);}
function weaponPool(){const p=[];for(const k in CFG.weapons){const w=CFG.weapons[k];if(w.tier&&wave>=w.wave)p.push(k);}
  p.sort((a,b)=>CFG.weapons[a].tier-CFG.weapons[b].tier);return p;}
function rollWeapon(best){const p=weaponPool();if(!p.length)return 'mg';
  const n=p.length,r=Math.random();
  let i=best?n-1-Math.floor(r*r*Math.min(n,3)):Math.floor(n*(.35+.65*Math.sqrt(r)));
  return p[clamp(i,0,n-1)];}
function upAvailable(k){return k==='wup'?player.baseLvl<CFG.baseWeapons.length-1:allyLvl<CFG.allyUpgrades.length-1;}
function rollUp(){const o=[];if(upAvailable('wup'))o.push('wup');if(upAvailable('sup'))o.push('sup');
  return o.length?o[Math.floor(Math.random()*o.length)]:null;}
function dropLoot(e){let t=null,heavy=e.type==='tank'||e.V;
  if(heavy){const r=Math.random();
    if(r<CFG.upDropHeavy)t=rollUp();
    if(!t){const r2=Math.random();t=r2<.2?'health':r2<.32?'grenade':rollWeapon(true);}}
  else{const r=Math.random();
    if(r<CFG.upDropSoldier)t=rollUp();
    if(!t){if(r<.14)t='health';else if(r<.22)t='grenade';else if(r<.22+CFG.weaponDropRate)t=rollWeapon(false);}}
  if(t)pickups.push({x:e.x,y:e.y,type:t,t:(t==='wup'||t==='sup')?30:15,bob:rand(0,6)});}

// ---------- プレイヤー ----------
function playerFire(){const p=player,w=CFG.weapons[p.weapon];p.fireCd=w.rate;
  const mx=p.x+Math.cos(p.ang)*24,my=p.y+Math.sin(p.ang)*24;
  for(let i=0;i<w.pellets;i++){const a=p.ang+rand(-w.spread,w.spread),s=w.spd*(w.pellets>1?rand(.85,1.1):1);
    const b={x:mx,y:my,vx:Math.cos(a)*s,vy:Math.sin(a)*s,dmg:w.dmg,owner:'p',life:w.life};
    if(w.rad){b.rocket=true;b.rad=w.rad;}
    if(w.pierce){b.pierce=w.pierce;b.hit=[];}
    if(w.ap)b.ap=true;
    if(w.flame){b.flame=true;b.dmg=w.dmg;}
    bullets.push(b);}
  addP({x:mx,y:my,life:.05,size:w.flame?9:(w.rad?14:(w.pellets>1?11:7)),color:w.flame?'#ff9a3a':'#ffe08a',kind:'flash'});
  if(!w.flame){const back=p.ang+Math.PI;for(let i=0;i<(w.rad?4:1);i++)
    addP({x:mx,y:my,vx:Math.cos(back)*rand(30,90),vy:Math.sin(back)*rand(30,90),life:.3,size:4,grow:8,color:'#7a7a70',kind:'smoke'});}
  shake=Math.max(shake,w.shake||1);
  sfx(w.rad?'cannon':'shot',w.rad?.8:(w.pellets>1?1.4:1));}
function throwGrenade(){if(state!=='play')return;const p=player;if(p.gren<=0||p.grenCd>0)return;
  p.gren--;p.grenCd=.6;const a=p.ang;let dist=0;
  while(dist<CFG.grenadeRange){const nx=p.x+Math.cos(a)*(dist+10),ny=p.y+Math.sin(a)*(dist+10);
    if(solidAt(nx,ny,true)||nx<10||ny<10||nx>WORLD-10||ny>WORLD-10)break;dist+=10;}
  grenades.push({sx:p.x,sy:p.y,tx:p.x+Math.cos(a)*dist,ty:p.y+Math.sin(a)*dist,t:0,dur:.35+dist/300*.5,fuse:.45,x:p.x,y:p.y,h:0,dist});
  sfx('throw');}
function updatePlayer(dt,inp){const p=player;
  if(p.inCar&&car&&!car.dead){const s=seatPos(car,SEATS.driver);p.x=s.x;p.y=s.y;p.moveAng=car.ang;p.walk=0;
    if(inp.aim!==null)p.ang=inp.touchAim?assist(inp.aim):inp.aim;else p.ang+=angDiff(p.ang,car.ang)*Math.min(1,dt*8);}
  else{p.inCar=false;const spd=CFG.playerSpeed*(p.weapon==='mg'?.88:1);
    moveEntity(p,inp.mx*spd*dt,inp.my*spd*dt);
    const moving=Math.hypot(inp.mx,inp.my)>.1;
    if(moving){p.walk+=dt*12;p.moveAng+=angDiff(p.moveAng,Math.atan2(inp.my,inp.mx))*Math.min(1,dt*3);}
    if(inp.aim!==null)p.ang=inp.touchAim?assist(inp.aim):inp.aim;
    else if(moving)p.ang+=angDiff(p.ang,Math.atan2(inp.my,inp.mx))*Math.min(1,dt*12);}
  p.fireCd-=dt;p.grenCd-=dt;p.hurt-=dt;
  if(p.weapon!==p.base){p.wTime-=dt;if(p.wTime<=0)p.weapon=p.base;}
  if(inp.fire&&p.fireCd<=0)playerFire();}

// ---------- 高機動車 ----------
const SEATS={driver:{x:0,y:10},riders:[{x:-20,y:-12},{x:-20,y:12},{x:-34,y:0}]};
function seatPos(c,s){const co=Math.cos(c.ang),si=Math.sin(c.ang);return{x:c.x+co*s.x-si*s.y,y:c.y+si*s.x+co*s.y};}
const CAR_NAMES=['1号車','2号車','3号車'];
function makeCar(x,y,ang,name){return{name:name||CAR_NAMES[0],x,y,ang,revT:0,revSteer:1,stuckT:1.2,lostT:0,speed:0,steer:0,hp:CFG.car.hp,maxHp:CFG.car.hp,hurt:0,dead:false};}
function vehHalf(c){return c.V?{L:c.V.len/2,Wd:c.V.wid/2}:{L:46,Wd:21};}
function carCircles(c){const {L,Wd}=vehHalf(c),co=Math.cos(c.ang),si=Math.sin(c.ang);
  const n=Math.max(2,Math.round(L/Wd)),out=[];
  for(let i=0;i<n;i++){const o=-(L-Wd)+(n>1?(L-Wd)*2*i/(n-1):0);out.push({x:c.x+co*o,y:c.y+si*o,r:Wd});}
  return out;}
function vehSeats(V){const n=V.riders,out=[],back=-V.len/2+16,rows=Math.ceil(n/2);
  for(let i=0;i<n;i++){const r=Math.floor(i/2),side=(i%2)?1:-1;
    out.push({x:back+(rows>1?r*(V.len*.32/(rows-1||1)):0)+8,y:n===1?0:side*(V.wid*.26)});}
  if(n===3)return[{x:-V.len*.22,y:-V.wid*.28},{x:-V.len*.22,y:V.wid*.28},{x:-V.len*.37,y:0}];
  return out;}
function carBlocked(c){return carCircles(c).some(q=>circleBlocked(q.x,q.y,q.r)||q.x<q.r||q.y<q.r||q.x>WORLD-q.r||q.y>WORLD-q.r);}
function inCarRect(c,x,y){const {L,Wd}=vehHalf(c),dx=x-c.x,dy=y-c.y,co=Math.cos(c.ang),si=Math.sin(c.ang);
  return Math.abs(dx*co+dy*si)<L&&Math.abs(-dx*si+dy*co)<Wd;}
function spawnCarNear(idx,x,y,quiet){for(let t=0;t<80;t++){const a=rand(0,TAU),d=rand(90,260);
    const c=makeCar(clamp(x+Math.cos(a)*d,60,WORLD-60),clamp(y+Math.sin(a)*d,60,WORLD-60),rand(0,TAU),CAR_NAMES[idx]);
    if(!carBlocked(c)){cars[idx]=c;if(idx===0)car=c;if(!quiet)popText(c.x,c.y-40,c.name+' 補給完了','#dfe8a0');return;}}}
function carAt(x,y){for(const c of cars)if(c&&!c.dead&&inCarRect(c,x,y))return c;return null;}
function ejectRiders(c){allies.forEach(a=>{if(!a.riding||a.vehicle!==c)return;a.riding=false;a.vehicle=null;const sr=SEATS.riders[a.seat];
    const q=seatPos(c,{x:sr.x-6,y:sr.y>=0?40:-40});a.x=q.x;a.y=q.y;pushOut(a);});}
function carBtn(){const g=grenBtn();return{x:W-150,y:g.y+10,r:30};}
function carBtnVisible(){return state==='play'&&car&&!car.dead&&(player.inCar||Math.hypot(player.x-car.x,player.y-car.y)<90);}
function toggleCar(){if(!carBtnVisible())return;
  if(player.inCar)exitCar();else{player.inCar=true;sticks.move=null;sfx('pickup');popText(car.x,car.y-36,'乗車！','#dfe8a0');}}
function exitCar(){const c=car;player.inCar=false;
  for(const s of[{x:0,y:44},{x:0,y:-44},{x:-66,y:0},{x:66,y:0}]){const q=seatPos(c,s);
    if(!circleBlocked(q.x,q.y,player.r)&&q.x>20&&q.y>20&&q.x<WORLD-20&&q.y<WORLD-20){player.x=q.x;player.y=q.y;break;}}
  pushOut(player);
  ejectRiders(c);}
function hurtCar(c,d){if(!c||c.dead)return;c.hp-=d;c.hurt=.08;if(c.hp<=0){c.hp=0;destroyCar(c);}}
function destroyCar(c){c.dead=true;const wasIn=c===car&&player.inCar,riders=allies.filter(a=>a.riding&&a.vehicle===c);
  addDecal({kind:'carwreck',x:c.x,y:c.y,ang:c.ang,t:1e9,smk:10});
  if(wasIn)exitCar();else ejectRiders(c);
  explode(c.x,c.y,100,90,'a');
  if(wasIn)hurtPlayer(25);riders.forEach(a=>hurtAlly(a,20));
  popText(c.x,c.y-40,c.name+' 大破！','#ff9a80');}
function carVsObstacles(c,onCrash){let hit=false;
  for(let it=0;it<2;it++)for(let k=0;k<2;k++){const q=carCircles(c)[k];
    for(const o of obstacles){if(o.hp<=0)continue;
      const nx=clamp(q.x,o.x,o.x+o.w),ny=clamp(q.y,o.y,o.y+o.h),dx=q.x-nx,dy=q.y-ny,d2=dx*dx+dy*dy;
      if(d2>=q.r*q.r)continue;
      if(o.hp!==Infinity&&Math.abs(c.speed)>CFG.car.smashSpeed){hurtObstacle(o,999);c.speed*=.75;if(c===car)shake=Math.max(shake,4);continue;}
      let px=0,py=0;
      if(d2<1e-6){const l=q.x-o.x,r=o.x+o.w-q.x,t=q.y-o.y,b=o.y+o.h-q.y,m=Math.min(l,r,t,b);
        if(m===l)px=-(l+q.r);else if(m===r)px=r+q.r;else if(m===t)py=-(t+q.r);else py=b+q.r;}
      else{const d=Math.sqrt(d2);px=dx/d*(q.r-d);py=dy/d*(q.r-d);}
      c.x+=px;c.y+=py;q.x+=px;q.y+=py;hit=true;}
    if(q.x<q.r){c.x+=q.r-q.x;hit=true;}if(q.y<q.r){c.y+=q.r-q.y;hit=true;}
    if(q.x>WORLD-q.r){c.x-=q.x-(WORLD-q.r);hit=true;}if(q.y>WORLD-q.r){c.y-=q.y-(WORLD-q.r);hit=true;}}
  if(hit){if(Math.abs(c.speed)>230){const sg=Math.sign(c.speed);(onCrash||(v=>hurtCar(c,v)))(Math.abs(c.speed)*.06);if(c===car)shake=Math.max(shake,5);
      sparks(c.x+Math.cos(c.ang)*46*sg,c.y+Math.sin(c.ang)*46*sg,8,'#ffd27a');}
    c.speed*=.55;}
  obstacles=obstacles.filter(o=>o.hp>0);}
function updateCar(c,dt,inp){const C=CFG.car;c.hurt-=dt;let throttle=0,steer=0;
  if(inp){const mag=Math.min(1,Math.hypot(inp.mx,inp.my));
    if(mag>.15){const ta=Math.atan2(inp.my,inp.mx),df=angDiff(c.ang,ta);
      if(Math.abs(df)>2.1&&c.speed<60&&!inp.fwd){throttle=-mag;steer=clamp(-angDiff(c.ang+Math.PI,ta)*1.6,-1,1);}
      else{throttle=mag*clamp(1.2-Math.abs(df)/2.5,.3,1);steer=clamp(df*1.8,-1,1);}}}
  c.steer+=(steer-c.steer)*Math.min(1,dt*10);
  if(throttle!==0){const target=throttle>0?C.maxSpeed*throttle:C.reverseSpeed*throttle;
    c.speed+=clamp(target-c.speed,-C.accel*1.6*dt,C.accel*dt);}
  else c.speed*=Math.max(0,1-1.6*dt);
  c.ang+=c.steer*C.turn*clamp(c.speed/120,-1,1)*dt;
  c.x+=Math.cos(c.ang)*c.speed*dt;c.y+=Math.sin(c.ang)*c.speed*dt;
  carVsObstacles(c);
  if(!c.dead&&Math.abs(c.speed)>140&&Math.random()<dt*25){const bx=c.x-Math.cos(c.ang)*44,by=c.y-Math.sin(c.ang)*44;

function updateAllies(dt){const p=player,playing=state==='play',pv=playing&&p.inCar&&car&&!car.dead?car:null;

        addP({x:bx,y:by,life:.05,size:6,color:'#ffcf7a',kind:'flash'});sfx('eshot',clamp(1-d/700,.1,1));
        if(e.mgBurst<=0)e.mgBurst=V.mgBurst;e.mgBurst--;e.mgCd=(e.mgBurst>0?V.mgRate:V.mgRest)*(e.rage?.7:1);}}}
  if(V.gas){e.gasT-=dt;if(t&&d<V.range&&e.gasT<=0){e.gasT=V.gasEvery;
      const gx=e.x-Math.cos(e.ang)*V.len*.4,gy=e.y-Math.sin(e.ang)*V.len*.4;

      if(hazards.length>14)hazards.shift();}}
  const c=CFG.soldier,vol=clamp(1-Math.hypot(player.x-e.x,player.y-e.y)/700,.1,1),st=vehSeats(V);
  for(const r of e.riders){r.fireCd-=dt;const sp=seatPos(e,st[r.seat]);r.x=sp.x;r.y=sp.y;
    const ra=t?Math.atan2(t.y-r.y,t.x-r.x):e.ang;r.ang+=angDiff(r.ang,ra)*Math.min(1,dt*8);
    if(t&&e.los&&d<V.range&&r.fireCd<=0&&Math.abs(angDiff(r.ang,ra))<.3){
      if(r.burst<=0)r.burst=c.burst;const a=r.ang+rand(-c.spread,c.spread)*1.4;
      const bx=r.x+Math.cos(r.ang)*20,by=r.y+Math.sin(r.ang)*20;
      bullets.push({x:bx,y:by,vx:Math.cos(a)*CFG.enemyBulletSpeed,vy:Math.sin(a)*CFG.enemyBulletSpeed,owner:'e',dmg:c.dmg,life:.9});
      addP({x:bx,y:by,life:.05,size:6,color:'#ffcf7a',kind:'flash'});sfx('eshot',vol);
      r.burst--;r.fireCd=r.burst>0?.13:rand(1.3,2.2);}}
  const fr=friendlies(),cs=carCircles(e);
  for(const f of fr)for(const q of cs){const dx=f.x-q.x,dy=f.y-q.y,rr=f.r+q.r,d2=dx*dx+dy*dy;if(d2>=rr*rr||d2<.01)continue;
    const dd=Math.sqrt(d2),o=rr-dd;f.x+=dx/dd*o*1.6;f.y+=dy/dd*o*1.6;pushOut(f);
    if(Math.abs(e.speed)>110&&e.bumpT<=0){if(f===player)hurtPlayer(V.ramDmg);else hurtAlly(f,V.ramDmg);
      e.bumpT=.8;e.speed*=.4;sparks(f.x,f.y,6,'#b04030');shake=Math.max(shake,f===player?6:2);
      if(e.mode==='ram'){e.revT=.7;e.revSteer=Math.random()<.5?1:-1;}}}
  if(Math.abs(e.speed)>140&&Math.random()<dt*20){const bx=e.x-Math.cos(e.ang)*V.len*.48,by=e.y-Math.sin(e.ang)*V.len*.48;
    addP({x:bx+rand(-14,14),y:by+rand(-14,14),vx:rand(-20,20),vy:rand(-20,20),life:rand(.5,1),size:6,grow:16,color:'#8a7a58',kind:'smoke',drag:2});}}
function enemyPickTarget(e){let best=null,bd=1e9;
  if(state==='play'){bd=Math.hypot(player.x-e.x,player.y-e.y)*CFG.allyTargetBias;best=player;}
  for(const a of allies){if(a.down||a.riding)continue;const d=Math.hypot(a.x-e.x,a.y-e.y);if(d<bd){bd=d;best=a;}}
  for(let k=1;k<cars.length;k++){const c=cars[k];if(!c||c.dead)continue;const d=Math.hypot(c.x-e.x,c.y-e.y)*1.1;if(d<bd){bd=d;best=c;}}
  if(!best&&cars[0]&&!cars[0].dead&&state==='play')best=cars[0];
  return best;}
function updateEnemies(dt){
  const cmds=enemies.filter(e=>!e.dead&&e.V&&e.V.command);
  if(cmds.length)for(const e of enemies){e.cmd=e.V&&e.V.command?false:cmds.some(c=>c!==e&&Math.hypot(c.x-e.x,c.y-e.y)<c.V.cmdRange);}
  else if(enemies.some(e=>e.cmd))for(const e of enemies)e.cmd=false;
  for(const e of enemies){if(e.dead)continue;
    e.hurt-=dt;e.checkT-=dt;
    if(e.tgt&&(e.tgt.down||e.tgt.dead||(e.tgt===player&&state!=='play')))e.checkT=0;
    if(e.checkT<=0){e.checkT=rand(.2,.35);e.tgt=enemyPickTarget(e);e.los=e.tgt?lineClear(e.x,e.y,e.tgt.x,e.tgt.y):false;}
    if(e.V){updateVehicle(e,dt);continue;}
    const t=e.tgt,hasT=!!t;
    const dx=hasT?t.x-e.x:0,dy=hasT?t.y-e.y:0,d=Math.hypot(dx,dy)||1,toP=Math.atan2(dy,dx);
    let vx=0,vy=0;
    if(e.avoidT>0){e.avoidT-=dt;vx=Math.cos(e.avoid);vy=Math.sin(e.avoid);}
    else if(!hasT){}
    else if(!e.los||d>e.range*.75){vx=dx/d;vy=dy/d;}
    else if(e.type!=='tank'){if(Math.random()<dt*.4)e.strafe*=-1;
      vx=-dy/d*e.strafe*.55;vy=dx/d*e.strafe*.55;if(d<170){vx-=dx/d*.6;vy-=dy/d*.6;}}
    moveEntity(e,vx*e.spd*dt,vy*e.spd*dt);
    const moving=vx!==0||vy!==0;if(moving)e.walk+=dt*10;
    e.stuckT-=dt;if(e.stuckT<=0){const mv=Math.hypot(e.x-e.lx,e.y-e.ly);
      if(moving&&e.avoidT<=0&&mv<e.spd*.12){e.avoid=toP+(Math.random()<.5?1:-1)*rand(1.2,1.9);e.avoidT=rand(.7,1.3);}
      e.lx=e.x;e.ly=e.y;e.stuckT=.45;}
    if(e.type==='tank'){if(moving){const ma=Math.atan2(vy,vx);e.body+=clamp(angDiff(e.body,ma),-1.6*dt,1.6*dt);e.tread+=dt*e.spd;}
      const tgt=e.los&&hasT?toP:e.body;e.tAng+=clamp(angDiff(e.tAng,tgt),-1.3*dt,1.3*dt);}
    else{const tgt=(e.los&&d<e.range&&hasT)?toP:(moving?Math.atan2(vy,vx):e.ang);e.ang+=angDiff(e.ang,tgt)*Math.min(1,dt*8);}
    e.fireCd-=dt;
    if(hasT&&e.los&&d<e.range&&e.fireCd<=0){const vol=clamp(1-Math.hypot(player.x-e.x,player.y-e.y)/700,.1,1);
      if(e.type==='tank'){if(Math.abs(angDiff(e.tAng,toP))<.12){const c=CFG.tank;
          const bx=e.x+Math.cos(e.tAng)*48,by=e.y+Math.sin(e.tAng)*48;
          bullets.push({x:bx,y:by,vx:Math.cos(e.tAng)*380,vy:Math.sin(e.tAng)*380,owner:'e',shell:true,dmg:c.shellDmg,rad:c.shellRadius,life:Math.min(d,e.range)/380});
          e.fireCd=c.reload*rand(.85,1.2);smoke(bx,by,4,14);addP({x:bx,y:by,life:.08,size:14,color:'#ffe08a',kind:'flash'});
          sfx('cannon',vol);shake=Math.max(shake,3*vol);}}
      else if(Math.abs(angDiff(e.ang,toP))<.3){const c=CFG[e.type];
        if(e.burst<=0)e.burst=c.burst;const a=e.ang+rand(-c.spread,c.spread);
        const bx=e.x+Math.cos(e.ang)*20,by=e.y+Math.sin(e.ang)*20;
        bullets.push({x:bx,y:by,vx:Math.cos(a)*CFG.enemyBulletSpeed,vy:Math.sin(a)*CFG.enemyBulletSpeed,owner:'e',dmg:c.dmg,life:.9});
        addP({x:bx,y:by,life:.05,size:6,color:'#ffcf7a',kind:'flash'});sfx('eshot',vol);
        e.burst--;e.fireCd=(e.burst>0?(e.type==='gunner'?.09:.13):rand(1.2,2.1)*(e.type==='gunner'?1.3:1))*(e.cmd?.7:1);}}
  }
  const fr=[];if(state==='play'&&!player.inCar)fr.push(player);for(const a of allies)if(!a.down&&!a.riding)fr.push(a);
  for(let i=0;i<enemies.length;i++){const a=enemies[i];
    for(let j=i+1;j<enemies.length;j++){const b=enemies[j],dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;
      if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),o=(rr-d)/2,wa=a.type==='tank'?.2:a.V?.3:1,wb=b.type==='tank'?.2:b.V?.3:1;
        a.x-=dx/d*o*wa;a.y-=dy/d*o*wa;b.x+=dx/d*o*wb;b.y+=dy/d*o*wb;}}
    if(!a.V)for(const f of fr){const dx=f.x-a.x,dy=f.y-a.y,rr=a.r+f.r,d2=dx*dx+dy*dy;
      if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),o=rr-d;
        if(a.type==='tank'){f.x+=dx/d*o;f.y+=dy/d*o;}
        else{a.x-=dx/d*o*.5;a.y-=dy/d*o*.5;f.x+=dx/d*o*.5;f.y+=dy/d*o*.5;}
        pushOut(f);}}}
  for(let i=0;i<fr.length;i++)for(let j=i+1;j<fr.length;j++){const a=fr[i],b=fr[j],dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;
    if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),o=rr-d,wa=a===player?0:.5,wb=a===player?1:.5;
      a.x-=dx/d*o*wa;a.y-=dy/d*o*wa;b.x+=dx/d*o*wb;b.y+=dy/d*o*wb;pushOut(a);pushOut(b);}}
  for(const cc of cars){if(!cc||cc.dead)continue;const cs=carCircles(cc),mine=cc===car;
    for(const e of enemies){if(e.dead)continue;for(const q of cs){const dx=e.x-q.x,dy=e.y-q.y,rr=e.r+q.r,d2=dx*dx+dy*dy;
      if(d2>=rr*rr||d2<.01)continue;const d=Math.sqrt(d2),o=rr-d;
      if(e.V){cc.x-=dx/d*o*.5;cc.y-=dy/d*o*.5;e.x+=dx/d*o*.5;e.y+=dy/d*o*.5;const rv=Math.abs(cc.speed)+Math.abs(e.speed);
        if(rv>150&&e.bumpT<=0){hurtCar(cc,rv*.05);hurtEnemy(e,rv*.4,true);e.bumpT=.6;if(mine)shake=Math.max(shake,5);sparks((cc.x+e.x)/2,(cc.y+e.y)/2,10,'#ffd27a');}
        cc.speed*=.5;e.speed*=.3;}
      else if(e.type==='tank'){cc.x-=dx/d*o;cc.y-=dy/d*o;if(Math.abs(cc.speed)>90){hurtCar(cc,Math.abs(cc.speed)*.06);if(mine)shake=Math.max(shake,5);}cc.speed*=.3;}
      else{if(Math.abs(cc.speed)>110){hurtEnemy(e,Math.abs(cc.speed)*CFG.car.ramDmg,true);cc.speed*=.9;sparks(e.x,e.y,5,'#c9b48a');}
        e.x+=dx/d*o;e.y+=dy/d*o;pushOut(e);}}}
    for(const f of fr)for(const q of cs){const dx=f.x-q.x,dy=f.y-q.y,rr=f.r+q.r,d2=dx*dx+dy*dy;
      if(d2>=rr*rr||d2<.01)continue;const d=Math.sqrt(d2),o=rr-d;f.x+=dx/d*o;f.y+=dy/d*o;pushOut(f);}}
  enemies=enemies.filter(e=>!e.dead);}

// ---------- 弾・手榴弾・アイテム ----------
function bulletBoom(b){explode(b.x,b.y,b.rad,b.dmg,b.owner==='e'?'e':'a');}
function updateBullets(dt){let obsChanged=false;const fr=[player,...allies];
  for(const b of bullets){if(b.dead)continue;const ex=b.shell||b.rocket,steps=ex?1:2;
    if(ex&&Math.random()<.4)addP({x:b.x,y:b.y,life:.4,size:4,grow:10,color:'#8a8a80',kind:'smoke'});
    if(b.homing){const t=b.homing;
      if(t.dead||(t===player&&state!=='play')||(t.down))b.homing=null;
      else{const want=Math.atan2(t.y-b.y,t.x-b.x),cur=Math.atan2(b.vy,b.vx),na=cur+clamp(angDiff(cur,want),-b.turn*dt,b.turn*dt);
        b.vx=Math.cos(na)*b.spd;b.vy=Math.sin(na)*b.spd;}
      addP({x:b.x,y:b.y,life:.5,size:5,grow:14,color:'#8a8a80',kind:'smoke'});}
    if(b.flame){addP({x:b.x,y:b.y,vx:b.vx*.15,vy:b.vy*.15,life:rand(.12,.3),size:rand(5,9),grow:22,color:Math.random()<.5?'#ff9a2e':'#ffd24a',kind:'fire',drag:3});
      if(Math.random()<.2)addP({x:b.x,y:b.y,life:.6,size:6,grow:18,color:'#5a5a52',kind:'smoke'});}
    if(b.ap&&Math.random()<.6)addP({x:b.x,y:b.y,life:.15,size:3,color:'#bfe4ff',kind:'flash'});
    for(let s=0;s<steps&&!b.dead;s++){b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;
      const o=solidAt(b.x,b.y,false);
      if(o){b.dead=true;
        if(ex)bulletBoom(b);
        else{sparks(b.x,b.y,b.flame?2:4,o.type==='building'?'#dddccc':'#e8cf96');if(o.hp!==Infinity){hurtObstacle(o,b.dmg*(b.ap?2:.5));obsChanged=true;}}
        break;}
      if(b.owner!=='e'){for(const e of enemies){if(e.dead)continue;if(b.hit&&b.hit.includes(e))continue;const dx=e.x-b.x,dy=e.y-b.y;
          if(e.V?inCarRect(e,b.x,b.y):dx*dx+dy*dy<e.r*e.r){
            if(ex){b.dead=true;bulletBoom(b);break;}
            hurtEnemy(e,b.dmg,b.ap,b.x,b.y);sparks(b.x,b.y,b.ap?8:4,e.type==='tank'||e.V?'#fff2a8':'#b04030');
            if(b.pierce>0){b.pierce--;b.hit.push(e);b.dmg*=.9;}else{b.dead=true;break;}}}}
      else if(carAt(b.x,b.y)){const hc=carAt(b.x,b.y);b.dead=true;if(ex)bulletBoom(b);else{hurtCar(hc,b.dmg);sparks(b.x,b.y,4,'#e8e0c0');}}
      else{for(const f of fr){if(f===player?(state!=='play'||player.inCar):(f.down||f.riding))continue;const dx=f.x-b.x,dy=f.y-b.y;
          if(dx*dx+dy*dy<f.r*f.r){b.dead=true;
            if(ex)bulletBoom(b);else{if(f===player)hurtPlayer(b.dmg);else hurtAlly(f,b.dmg);sparks(b.x,b.y,4,'#b04030');}break;}}}}
    b.life-=dt;if(!b.dead&&b.life<=0){b.dead=true;if(ex)bulletBoom(b);}}
  bullets=bullets.filter(b=>!b.dead);if(obsChanged)obstacles=obstacles.filter(o=>o.hp>0);}
function updateGrenades(dt){for(const g of grenades){g.t+=dt;const k=Math.min(1,g.t/g.dur);
    g.x=g.sx+(g.tx-g.sx)*k;g.y=g.sy+(g.ty-g.sy)*k;g.h=Math.sin(k*Math.PI)*(20+g.dist*.18);
    if(k>=1){g.fuse-=dt;if(g.fuse<=0){g.dead=true;explode(g.x,g.y,CFG.grenadeRadius,CFG.grenadeDmg,'p');}}}
  grenades=grenades.filter(g=>!g.dead);}
function updatePickups(dt){const p=player;
  for(const k of pickups){k.t-=dt;if(k.t<=0){k.dead=true;continue;}
    const up=k.type==='wup'||k.type==='sup';
    const pr=p.inCar?48:p.r+18,px=p.inCar&&car?car.x:p.x,py=p.inCar&&car?car.y:p.y;

      else{const w=CFG.weapons[k.type];p.weapon=k.type;p.wTime=w.time||CFG.powerupTime;

function updateDecals(dt){for(const d of decals){

function updateParticles(dt){for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.drag){const f=Math.max(0,1-p.drag*dt);p.vx*=f;p.vy*=f;}p.size+=p.grow*dt;}

    [7,'cmd82',1],[8,'chem',1],[9,'aaa87',1],[10,'type90',1]];

    for(let i=0;i<bn;i++)q.push(bossType);}
  const debut={2:'jeep',3:'lav',4:'truck73',5:'apc96',6:'recon87',7:'cmd82',8:'chem',9:'aaa87',10:'type90'}[n];
  const subs={jeep:'敵の車両が兵士を運んでくる！',lav:'軽装甲機動車が突っ込んでくる',truck73:'73式大型トラックが6人を降ろす',
    apc96:'96式装輪装甲車 出現　装甲が厚い',recon87:'87式偵察警戒車 出現　25mm砲に注意',cmd82:'82式指揮通信車 出現　周りの敵が強化される',
    chem:'化学防護車 出現　ガスの中は危険',aaa87:'87式自走高射機関砲 出現　猛烈な弾幕',type90:'90式戦車 出現　手榴弾とロケットで'};
  spawnQueue=q;spawnT=1.5;

    const w=CFG.weapons[p.weapon],tmp=p.weapon!==p.base;
    txt(w.name+(tmp?` ${Math.ceil(p.wTime)}s`:'')+(p.baseLvl?`  基本+${p.baseLvl}`:''),x+2,y+47,12,tmp?(w.col||'#ffd45a'):'#e8e2c8');
    const sq=Math.max(1,Math.min(3,Math.ceil(allies.length/3)));
    const ay=y+70;ctx.fillStyle='rgba(20,24,14,.55)';rrect(x-4,ay-4,190,20+sq*18,8);ctx.fill();
    txt('車両',x+40,ay+4,9,'rgba(232,226,200,.7)');txt(`仲間 ${allies.filter(a=>!a.down).length}/${CFG.allies.length} ${allyLv().label}`,x+108,ay+4,9,allyLvl?'#9fd8ff':'rgba(232,226,200,.7)');
    for(let k=0;k<sq;k++){const yy=ay+20+k*18,c=cars[k];txt(CAR_NAMES[k],x+2,yy,11,'#dfe8a0');
      if(!c||c.dead)txt('大破',x+40,yy,11,'#ff8a70');
      else{ctx.fillStyle='#2a2a24';ctx.fillRect(x+40,yy-4,60,8);ctx.fillStyle='#c8c070';ctx.fillRect(x+40,yy-4,60*c.hp/c.maxHp,8);}
      allies.filter(a=>a.squad===k).forEach((a,j)=>{const bx=x+108+j*24;
        if(a.down){if(Math.floor(time*3)%2){ctx.fillStyle='#ff5a4a';ctx.fillRect(bx,yy-4,20,8);}}
        else{ctx.fillStyle='#2a2a24';ctx.fillRect(bx,yy-4,20,8);ctx.fillStyle=['#4fb4ff','#7ce0a0','#ffd45a','#ff9a5a'][clamp(allyLvl,0,3)];ctx.fillRect(bx,yy-4,20*a.hp/a.maxHp,8);}});}
    const m=Math.min(110,W*.26),mx=W-m-12,my=12,k=m/WORLD;
    ctx.fillStyle='rgba(20,24,14,.6)';ctx.fillRect(mx,my,m,m);ctx.strokeStyle='rgba(232,226,200,.4)';ctx.lineWidth=1;ctx.strokeRect(mx,my,m,m);
    ctx.fillStyle='rgba(200,190,170,.5)';for(const o of obstacles)if(o.type==='building')ctx.fillRect(mx+o.x*k,my+o.y*k,Math.max(1,o.w*k),Math.max(1,o.h*k));
    for(const e of enemies){ctx.fillStyle=e.boss?'#ffd45a':e.type==='tank'?'#ffae3a':e.V?'#ff7a4a':'#ff5a4a';const s=e.boss?6:e.type==='tank'||e.V?4:2.5;ctx.fillRect(mx+e.x*k-s/2,my+e.y*k-s/2,s,s);}
    for(const a of allies){if(a.down&&Math.floor(time*4)%2)continue;ctx.fillStyle=a.down?'#fff':'#4fb4ff';ctx.fillRect(mx+a.x*k-1.5,my+a.y*k-1.5,3,3);}
    for(const c of cars){if(!c||c.dead)continue;ctx.fillStyle='#e8e0a0';ctx.fillRect(mx+c.x*k-2.5,my+c.y*k-2.5,5,5);}
    ctx.fillStyle='#9f6';ctx.fillRect(mx+p.x*k-2,my+p.y*k-2,4,4);
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.strokeRect(mx+(camX-W/2/S)*k,my+(camY-H/2/S)*k,W/S*k,H/S*k);}
  if(state==='play'){
    drawStick(sticks.move,90,H-100,player.inCar?'運転':'移動');drawStick(sticks.aim,W-120,H-100,'照準');
    const g=grenBtn(),p=player,ok=p.gren>0;
    ctx.fillStyle=ok?'rgba(70,85,45,.75)':'rgba(50,50,50,.5)';ctx.strokeStyle='rgba(232,226,200,.6)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle=ok?'#2f3a20':'#444';ctx.beginPath();ctx.ellipse(g.x,g.y+2,9,11,0,0,TAU);ctx.fill();ctx.fillStyle='#999';ctx.fillRect(g.x-3,g.y-12,6,4);
    txt('×'+p.gren,g.x,g.y+g.r+12,13,'#e8e2c8','center');
    if(carBtnVisible()){const b=carBtn();ctx.fillStyle='rgba(95,102,68,.85)';ctx.strokeStyle='rgba(232,226,200,.75)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.stroke();txt(player.inCar?'降りる':'乗る',b.x,b.y,13,'#fff','center');}}
  if(banner){const a=clamp(banner.t,0,1);ctx.globalAlpha=a;
    txt(banner.text,W/2,H*.3,Math.min(46,W/9),'#f0dfa0','center');
    if(banner.sub)txt(banner.sub,W/2,H*.3+Math.min(40,W/10),15,'#e8e2c8','center');ctx.globalAlpha=1;}
  if(state==='title'){ctx.fillStyle='rgba(16,20,10,.62)';ctx.fillRect(0,0,W,H);
    const ts=Math.min(52,W/8);txt('戦場シューター',W/2,H*.26,ts,'#f0dfa0','center');
    const lines=['左側をドラッグ：移動','右側をドラッグ：狙って撃つ（照準補助あり）','手榴弾ボタン：土のうを越えて投げられる','敵が落とす武器はWAVEが進むほど強くなる','↑アイテムで自分と仲間の武器が恒久的に強化される','5の倍数のWAVEは各国の戦車がボスとして出る','仲間はWAVEをクリアするたびに1人ずつ合流する','高機動車に近づいて「乗る」。味方も荷台から撃つ'];
    lines.forEach((l,i)=>txt(l,W/2,H*.4+i*Math.min(26,H*.05),Math.min(16,W/28),'#e8e2c8','center'));
    if(Math.floor(time*2)%2===0)txt('タップでスタート',W/2,H*.8,22,'#fff','center');
    if(!('ontouchstart' in window))txt('PC：WASD 移動／マウスで狙ってクリック射撃／G 手榴弾／E 乗り降り',W/2,H*.9,12,'rgba(232,226,200,.7)','center');}
  if(state==='over'){ctx.fillStyle=`rgba(40,8,6,${Math.min(.6,overT)})`;ctx.fillRect(0,0,W,H);
    txt('作戦失敗',W/2,H*.33,Math.min(50,W/8),'#ff8a70','center');
    txt(`WAVE ${wave}　SCORE ${score}`,W/2,H*.45,20,'#f0dfa0','center');
    txt(`ベスト ${best}`,W/2,H*.52,16,'#e8e2c8','center');
    if(overT>.8&&Math.floor(time*2)%2===0)txt('タップでもう一度',W/2,H*.68,20,'#fff','center');}}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#20251a';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2+(Math.random()-.5)*shake,H/2+(Math.random()-.5)*shake);ctx.scale(S,S);ctx.translate(-camX,-camY);
  drawWorld();ctx.restore();drawHUD();}

genMap();player=newPlayer();
let last=performance.now();
let fbGone=false;
function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();
  if(!fbGone){fbGone=true;const f=document.getElementById('fb');if(f)f.remove();}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
